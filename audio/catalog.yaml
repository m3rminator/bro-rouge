# Every sound in the game. Generated once by tools/audio_build.py (ElevenLabs),
# then locked in audio.lock.json — rebuilding never re-rolls an approved sound.
# To change one: edit its prompt, then run with --regen NAME.
sfx:
  shoot:
    prompt: "Single retro 16-bit arcade machine gun shot, punchy and short, no reverb"
    duration: 0.5
  jump:
    prompt: "Quick retro video game jump sound, short upward whoosh, 16-bit"
    duration: 0.5
  land:
    prompt: "Soft thud of boots landing on dirt, short, video game"
    duration: 0.5
  footstep:
    prompt: "Single boot footstep on dirt, short and dry, video game"
    duration: 0.5
  block_break:
    prompt: "Dirt block exploding into debris, crunchy retro 16-bit explosion, short"
    duration: 0.8
  block_hit:
    prompt: "Bullet impact on packed dirt, short crunchy thump, video game"
    duration: 0.5
  enemy_shoot:
    prompt: "Single retro 16-bit assault rifle shot from an enemy soldier, slightly lower and harsher than the hero's gun, short, no reverb"
    duration: 0.5
  enemy_alert:
    prompt: "Short surprised male grunt 'huh!' of an enemy soldier spotting someone, retro video game voice"
    duration: 0.6
  enemy_death:
    prompt: "Short comic male death scream 'argh' of an enemy soldier being shot, retro action video game"
    duration: 0.8
  player_hurt:
    prompt: "Short pained male grunt of an action hero being hit by a bullet, retro video game"
    duration: 0.5
  player_death:
    prompt: "Dramatic male death yell of an action hero, short, retro 80s action video game"
    duration: 1.0
  explosion_small:
    prompt: "Punchy retro 16-bit video game explosion, a single barrel blowing up, crunchy boom with short debris rattle, no music"
    duration: 1.2
  explosion_big:
    prompt: "Huge deep retro 16-bit video game explosion, several fuel barrels blowing up at once, heavy rumbling boom with long debris tail, no music"
    duration: 2.0
  barrel_ignite:
    prompt: "Short whoosh of a fuel barrel catching fire with a sizzling fuse hiss, video game"
    duration: 0.6
  blood_splat:
    prompt: "Short wet comic gore splat, cartoony retro action video game, no voice"
    duration: 0.5
  kamikaze_scream:
    prompt: "Crazed enemy soldier yelling a wordless battle cry 'aaaaah!' while charging, retro action video game voice"
    duration: 1.0
  brute_alert:
    prompt: "Deep menacing roar of a huge armored soldier through a gas mask, short, retro action video game"
    duration: 1.0
  minigun_spinup:
    prompt: "Electric minigun barrels spinning up, rising mechanical whine, short, video game"
    duration: 0.8
  minigun_fire:
    prompt: "Retro 16-bit minigun firing a continuous rapid burst, brrrrt, mechanical, no reverb"
    duration: 1.4
  brute_death:
    prompt: "Big heavy man's death groan followed by a heavy body and metal guns crashing to the ground, retro action video game"
    duration: 1.5
  quota_reached:
    prompt: "Short triumphant retro 16-bit video game jingle, objective complete, two rising notes"
    duration: 1.0
  level_clear:
    prompt: "Short victorious retro 16-bit video game fanfare, level complete, bright synth brass"
    duration: 2.0
  exit_locked:
    prompt: "Short negative error buzz, retro 16-bit video game, access denied"
    duration: 0.5
  reload:
    prompt: "Rifle magazine being ejected and a fresh one slapped in, two quick metallic clacks, short, video game"
    duration: 1.0
  dry_fire:
    prompt: "Single dry click of an empty rifle trigger, short metallic, video game"
    duration: 0.5
  bro_shout:
    prompt: "Action hero roaring a wordless angry battle cry while firing wildly, short, retro 80s action video game voice"
    duration: 1.0
  knife_swing:
    prompt: "Fast combat knife slash whoosh through the air, sharp and short, retro action video game"
    duration: 0.5
  knife_stab:
    prompt: "Brutal knife stab into flesh, wet meaty thud with a short squelch, retro action video game hit"
    duration: 0.5
  blala_shoot:
    prompt: "Single retro 16-bit submachine gun shot, light snappy high-pitched pop, much shorter and thinner than a rifle, punchy, no reverb"
    duration: 0.5
  gun_bash:
    prompt: "Heavy metal submachine gun smashed into an enemy soldier's head, hard blunt metallic clonk with a meaty thud, short, retro action video game hit, no voice"
    duration: 0.5
  grenade_throw:
    prompt: "Grenade pin pulled with a metallic ping and the spoon flicking off, then a quick throwing whoosh, short, retro action video game"
    duration: 0.6
  grenade_bounce:
    prompt: "Small metal grenade bouncing once on dirt, short dull metallic clink, video game"
    duration: 0.5
  enemy_panic:
    prompt: "Short panicked male yell 'grenade!' of an enemy soldier running away, retro action video game voice"
    duration: 0.8
  raygun_shot:
    prompt: "Retro 16-bit sci-fi raygun blast: a sharp rising electric zap with a bright laser 'pew' and a short crackle tail, punchy, no reverb, video game"
    duration: 0.7
  raygun_wave:
    prompt: "Retro sci-fi energy shockwave impact: a deep bassy 'whoomp' pulse with a rushing air ripple and electric crackle, no fire, no explosion debris, no music, video game"
    duration: 1.0
  disco_party:
    prompt: "Short funky 70s disco groove loop for a retro video game: four-on-the-floor kick, open hi-hats, slap bass and a wah guitar stab, playful, instrumental, seamless loop"
    duration: 4.0
  disco_burst:
    prompt: "Comic party burst in a retro video game: a big confetti cannon pop with a glittery synth sparkle sweep, playful, short, no music"
    duration: 1.0

music:
  level_jungle:
    prompt: "Upbeat 80s action movie synth rock loop for a retro pixel-art run and gun video game, driving drums, electric guitar riffs, heroic, instrumental"
    duration: 60
