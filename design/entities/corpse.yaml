# Entity: enemy bodies (shared by every enemy that leaves one).
id: corpse
name: Corpse (enemy body)
kind: effect
order: 14
description: A killed mook or Brute leaves a body that stays for the rest of the level. It flails (hurt pose) while flying and lies flat when it lands, with a pool of blood under it. Bodies are still physical — walk through one and it is nudged and dragged along the ground without leaving its lying pose; shoot one and it is knocked back and tossed a bit (and bleeds) — three bullets (or one knife stab) tear it into pieces (blood and limbs, no blast); explosions throw them hard. A body whose head was blown off (head.yaml) lies headless and pumps blood out of the neck for a few seconds. Bodies never block the Bro or bullets of enemies.
sprite: mook
files:
  - game/scripts/enemy.gd
spawned_by: [mook, brute]

stats:
  bump_speed:
    value: 0.3
    unit: × Bro speed
    description: When the Bro first walks into a body it is pushed at this fraction of his speed...
  bump_hop:
    value: -25.0
    unit: px/s
    description: ...and hops up this much (negative = up).
  drag:
    value: 0.23
    unit: × Bro speed
    description: While the Bro keeps walking through it, the body is dragged along at this fraction of his speed.
  friction:
    value: 260.0
    unit: px/s²
    description: How fast a sliding body stops on the ground.
  shot_knockback:
    value: 110.0
    unit: px/s
    description: Sideways speed a bullet gives a body.
  shot_hop:
    value: -95.0
    unit: px/s
    description: Upward speed a bullet gives a body (negative = up).
  burst_hits:
    value: 3
    unit: bullets
    description: Bullets a body can take. The last one makes it burst into a shower of gore with a splat sound and a pool — no blast, nothing is damaged; the body is gone.
  lying_height:
    value: 18
    unit: px
    description: Height of a lying body's collision box (width = 80% of the standing height) — tall enough that the Bro's bullets hit it, standing or crouched.
  neck:
    value: [9, 8]
    unit: px
    description: Where the neck of a headless body is, from the center of its sprite (facing right).
  fountain_time:
    value: 4.0
    unit: s
    description: How long blood pumps out of the neck after the head is blown off (weaker and weaker).
  fountain_speed:
    value: 170.0
    unit: px/s
    description: Speed of the blood jet at its strongest.
  fountain_beat:
    value: 2.5
    unit: beats/s
    description: The jet pumps in heartbeats this fast.
  fountain_drops:
    value: 3
    unit: drops
    description: Real blood drops thrown every 0.1 s on top of the particles, so the ground around gets soaked.

animations:
  hurt: Flying through the air (knocked back, shot or blasted).
  dead_a: "Lying on the ground, pose A — traced pixel for pixel from its own reference. Every body gets A or B at random (50 / 50)."
  dead_b: Lying on the ground, pose B (one leg and one hand raised) — traced pixel for pixel from its own reference.
  headless_a: Pose A with the head blown off (head.yaml) — the same body cut at the neck, a skin stump where the head was. Also used while a headless body flies.
  headless_b: Pose B with the head blown off.
