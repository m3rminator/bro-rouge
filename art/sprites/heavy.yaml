# Heavy, the fourth Bro: bald, dark beard, black leather jacket over a white tank top, blue jeans, black boots and a
# big minigun held low at the hip with an ammo belt hanging from it. Drawn step by step with the user on top of the
# Bro's poses (same size, same leg motion). Every frame is one whole pose. The barrels turn while he fires and while
# they spin up (windup / run_windup / crouch_windup, no flash). Frame layers: [part, x, y]. Feet on the bottom row.
name: heavy
description: Heavy, the fourth playable Bro. Bald with a dark beard, black leather jacket over a white tank top, blue jeans, black boots and a big minigun held low at the hip. The barrels spin up before the first bullet, then he shakes with every shot. Faces right; the game flips it.
palette: heavy
frame: [51, 36]  # 39-wide body poses with 6 spare columns each side (the melee shoves the minigun forward)
muzzle_symbols: GgiI  # gun tip per frame is found from these colors (GameData.MUZZLES)
anchors:
  feet: [25, 35]

