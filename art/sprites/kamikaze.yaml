# Suicide bomber. Built on the traced enemy soldier's poses (same style and size as the Bro),
# reworked from refrences/enemies/kamikaze: bald tanned head with a red headband whose tails
# hang down his back, charcoal long sleeves, a vest of crossed red dynamite sticks on black
# straps, khaki pants and brown boots; he holds a lit stick.
# Frame layers: [part, x, y]. Feet on the bottom row. Faces right; the game flips it.
name: kamikaze
description: "Suicide bomber in the enemy soldiers' style. Bald with a red headband, charcoal sleeves, a vest of red dynamite sticks, khaki pants and a lit stick in his fist; when he spots you he screams and sprints at you to blow you both up."
