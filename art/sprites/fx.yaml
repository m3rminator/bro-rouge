# Small effects: muzzle flash, bullets, enemy alert bubble, HUD hearts.
name: fx
description: Muzzle flash, player and enemy bullets, the enemy "!" alert bubble and HUD hearts.
palette: fx
frame: [8, 8]
anchors:
  center: [4, 4]

parts:
  flash_big: |
    ..Y.....
    .YWY.Y..
    YWWWWWYO
    .YWY.Y..
    ..Y.....
  flash_small: |
    .Y....
    YWWYO.
    .Y....
  bullet: |
    RYWWW
    RYWWW
  enemy_bullet: |
    rRRO
    rRRO
  alert: |
    ooooooo.
    owwrwwo.
    owwrwwo.
    owwrwwo.
    owwwwwo.
    owwrwwo.
    ooowooo.
    ...o....
  heart_full: |
    .oo.oo.
    owroRro
    orrrrro
    .orrro.
    ..oro..
    ...o...
  heart_empty: |
    .oo.oo.
    oGGoGGo
    oGGGGGo
    .oGGGo.
    ..oGo..
    ...o...

animations:
  muzzle:
    fps: 20
    loop: false
    frames:
      - [[flash_big, 0, 2]]
      - [[flash_small, 0, 3]]
  bullet:
    fps: 1
    loop: false
    frames:
      - [[bullet, 2, 3]]
  enemy_bullet:
    fps: 1
    loop: false
    frames:
      - [[enemy_bullet, 2, 3]]
  alert:
    fps: 1
    loop: false
    frames:
      - [[alert, 0, 0]]
  heart_full:
    fps: 1
    loop: false
    frames:
      - [[heart_full, 0, 1]]
  heart_empty:
    fps: 1
    loop: false
    frames:
      - [[heart_empty, 0, 1]]
