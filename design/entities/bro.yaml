# Entity: the default Bro (player character).
# "stats" are generated into GameData.BRO — the game reads them from there,
# so the numbers in the catalog are always the numbers in the game.
id: bro
name: Bro (default)
kind: player
order: 1
description: The player character (Rambo look). Stands one and a half blocks tall (24 px); holding Crouch makes him exactly one block tall (16 px) and slower, so he fits through a single destroyed block. Runs, jumps, sprays rifle fire; dies after max_hp hits (bullets, or blasts which take several hearts at once). Each death costs one run life and restarts the current level (design/run.yaml). Every future Bro copies this file and changes what makes them unique.
sprite: bro
files:
  - game/scenes/player.tscn
  - game/scripts/player.gd
controls: [move_left, move_right, jump, crouch, shoot]
level_symbols:
  "P": player start position (air tile)
level_preview:
  "P": {anim: idle}
spawns: [bullet]

stats:
  speed:
    value: 120.0
    unit: px/s
    description: Horizontal run speed (one tile is 16 px).
  jump_velocity:
    value: -290.0
    unit: px/s
    description: Upward speed at the start of a jump (negative = up). Higher magnitude = higher jump (~3 tiles now).
  gravity:
    value: 800.0
    unit: px/s²
    description: Downward acceleration while in the air.
  fire_interval:
    value: 0.11
    unit: s
    description: Time between shots while holding Shoot (~9 shots per second).
  max_hp:
    value: 3
    unit: hp
    description: Enemy bullet hits the Bro can take. Shown as hearts in the HUD.
  invulnerable_time:
    value: 1.0
    unit: s
    description: After being hit, the Bro blinks and can't be hurt again for this long.
  respawn_delay:
    value: 2.0
    unit: s
    description: Time between dying and the level restarting.
  speed_crouch:
    value: 55.0
    unit: px/s
    description: Horizontal speed while crouched (less than half of the standing speed).
  hitbox:
    value: [10, 22]
    unit: px
    description: Standing collision box, width × height — one and a half blocks tall (a block is 16 px).
  hitbox_crouch:
    value: [10, 14]
    unit: px
    description: Crouched collision box. Fits inside one 16 × 16 block, so he can crawl through a single-block tunnel.

animations:
  idle: Standing on the ground, not moving, not shooting.
  run: Moving left/right on the ground. Plays the footstep sound on frames 0 and 2.
  jump: Any time the Bro is in the air (rising or falling).
  shoot: Standing still while firing — the gun kicks back 1 px.
  crouch: Holding Crouch, standing still (one block tall).
  crouch_walk: Crouched and moving (slow).
  crouch_shoot: Crouched and firing — the gun kicks back 1 px.
  hurt: Dead — the body is knocked back and falls over.

sounds:
  shoot: Every shot.
  jump: When a jump starts.
  land: When touching the ground after being in the air.
  footstep: Run animation frames 0 and 2.
  player_hurt: Hit by an enemy bullet (and survives).
  player_death: Last hit point lost.
