# Destructible terrain, 24x24, no outline so tiles join seamlessly.
# Many random variants per kind (generated once by a seeded helper, now hand-owned ASCII - edit freely).
# Which kind a block uses depends on how close it is to open air (scripts/main.gd, tools/build.py):
#   grass_N           surface of the earth biome: one block with its own grass (rim, loops, strands, moss) - nothing hangs onto the next block
#   earth_N / pebble_N  layer 2 (two rows under the grass): calm dark earth with tiny tufts, the odd stone
#   mid_N             transition: earth with big dark patches, mixed in with earth above and subsoil below so there is no hard line
#   subsoil_N / flint_N  layer 3 and deeper: almost flat dark earth (flint = with a stone)
#   rock_N            rocky ground, never generated - kept for hand placement in the level editor
#   stonetop_N, stone_N, deep_N  the stone biome: lit top, slabs near the air, flat dark rock deeper in
#   wall_N / stonewall_N  back wall: shown behind a block that has been shot away (not solid, darker than any block)
name: terrain
description: Earth, rock, stone, grass-topped and back-wall variants.
palette: terrain
frame: [24, 24]

