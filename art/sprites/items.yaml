# Item icons. The magazine is drawn from its reference (refrences/items): the pixel-for-pixel
# trace (34 x 52) cut down to a third (HUD icon, keeps the cap, ridges, curve and base plate)
# and to a quarter (the small pick-up icon over the Bro's head), then cleaned by hand.
# The grenade icon is the pineapple grenade of refrences/items/25c1cc54-...jpg cut down to the
# HUD size (lever, pin ring, yellow band, segmented body). In the level the thrown grenade is just
# a small round ball with its lever on top (the pin is pulled), blinking red as the fuse burns.
name: items
description: Item icons - the magazine shown in the HUD (one per spare magazine), the "+ magazine" pop-up over the Bro's head when a knife kill gives him one, the grenade HUD icon (one per grenade left), the thrown grenade (blinks red while its fuse burns); Sharif's shotgun shell (HUD icon and "+ shells" pop-up), Blala's SMG magazine (HUD icon and pop-up) and Blala's C4 (HUD icon and the planted charge with its blinking red display); Sharif's revolver HUD icon and Hamid's air-strike missile HUD icon.
palette: items
reference: refrences/items/57d2b35a-865a-42b5-bd4c-b10d9abaf164.jpg
frame: [16, 16]

