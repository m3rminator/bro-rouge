animations:
  idle:  # approved 2026-10-25; breathing bob like the other Bros
    fps: 3
    loop: true
    frames:
      - [[idle_legs, 7, 27], [idle_top, 7, 4]]
      - [[idle_legs, 7, 27], [idle_top, 7, 5]]
  run:  # stride, then the idle pose (legs together), like the other Bros
    fps: 8
    loop: true
    frames:
      - [[run, 4, 4]]
      - [[idle_legs, 7, 27], [idle_top, 7, 5]]
  sprint:  # double-tap run: the run cycle leaning forward
    fps: 8
    loop: true
    frames:
      - [[sprint_0, 5, 4]]
      - [[sprint_1, 10, 5]]
  shoot:  # shot (raygun_flash at the muzzle), hard kick (whole upper body 2 px back), settle (1 px back)
    fps: 18
    loop: true
    frames:
      - [[idle_legs, 7, 27], [idle_top, 7, 4]]
      - [[idle_legs, 7, 27], [shoot_kick1, 5, 4]]
      - [[idle_legs, 7, 27], [shoot_kick2, 6, 4]]
  crouch:  # torso shortened like Blala's crouch; Blala's crouch legs
    fps: 2
    loop: true
    frames:
      - [[crouch_legs, 6, 29], [crouch_top, 5, 10]]
      - [[crouch_legs, 6, 29], [crouch_top, 5, 11]]
  crouch_walk:
    fps: 8
    loop: true
    frames:
      - [[crouch_legs, 6, 29], [crouch_top, 5, 11]]
      - [[crouch_legs_step, 6, 29], [crouch_top, 5, 10]]
      - [[crouch_legs_plant, 6, 29], [crouch_top, 5, 11]]
      - [[crouch_legs_drag, 6, 29], [crouch_top, 5, 10]]
  crouch_shoot:  # same recoil as standing: shot, hard kick (upper body 2 px back), settle (1 px back)
    fps: 18
    loop: true
    frames:
      - [[crouch_legs, 6, 29], [crouch_top, 5, 10]]
      - [[crouch_legs, 6, 29], [crouch_kick1, 3, 10]]
      - [[crouch_legs, 6, 29], [crouch_kick2, 4, 10]]
  jump:  # the idle top 1 px higher, legs tucked
    fps: 1
    loop: false
    frames:
      - [[jump_legs, 7, 26], [idle_top, 7, 3]]
  knife:  # melee: punch with the free hand - raygun up, body turns away, punch (hit on frame 4), turn back
    fps: 14
    loop: false
    frames:
      - [[idle_legs, 7, 27], [melee_1, 7, 0]]
      - [[idle_legs, 7, 27], [melee_2, 6, 0]]
      - [[melee_legs, 7, 27], [melee_3, 7, 0]]
      - [[melee_legs, 7, 27], [melee_4, 8, 0]]
      - [[melee_legs, 7, 27], [melee_4, 8, 0]]
      - [[melee_legs, 7, 27], [melee_5, 7, 0]]
  crouch_knife:  # the melee punch while crouched (hit on frame 4)
    fps: 14
    loop: false
    frames:
      - [[crouch_legs, 6, 29], [crouch_melee_1, 5, 6]]
      - [[crouch_legs, 6, 29], [crouch_melee_2, 4, 6]]
      - [[crouch_legs, 6, 29], [crouch_melee_3, 5, 6]]
      - [[crouch_legs, 6, 29], [crouch_melee_4, 6, 6]]
      - [[crouch_legs, 6, 29], [crouch_melee_4, 6, 6]]
      - [[crouch_legs, 6, 29], [crouch_melee_5, 5, 6]]
  cling:  # hangs by the free fist, raygun held across the waist like Blala; a slow sway toward the wall and back
    fps: 3
    loop: true
    frames:
      - [[melee_legs, 7, 27], [cling_a, 7, 0]]
      - [[melee_legs, 7, 27], [cling_a, 7, 0]]
      - [[melee_legs, 8, 27], [cling_b, 7, 0]]
      - [[melee_legs, 8, 27], [cling_b, 7, 0]]
  flip:  # forward somersault, one turn every 0.25 s (the game turns it the right way when facing left)
    fps: 16
    loop: true
    frames:
      - [[flip_0, 2, 8]]
      - [[flip_90, 6, 1]]
      - [[flip_180, 2, 8]]
      - [[flip_270, 6, 1]]
  run_shoot:  # running with the raygun out: no shake (the raygun fires slowly); each shot plays run_recoil once
    fps: 8
    loop: true
    frames:
      - [[run, 4, 4]]
      - [[idle_legs, 7, 27], [idle_top, 7, 5]]
  run_recoil:  # ONE shot while running (not looped): hard kick, settle, then back to run_shoot
    fps: 13
    loop: false
    frames:
      - [[run_kick1, 4, 4]]
      - [[run_kick2, 4, 4]]
  climb:  # unused by the game (same as the other Bros): squashed crouch, rising, crouch
    fps: 10
    loop: false
    frames:
      - [[crouch_legs, 6, 29], [crouch_top, 5, 12]]
      - [[crouch_legs, 6, 29], [crouch_top, 5, 11]]
      - [[crouch_legs, 6, 29], [crouch_top, 5, 10]]
  roll:  # landing roll (fall from 2-3+ blocks while moving, not shooting): squash, compact tuck turning on the ground in 45-deg steps, rise
    fps: 24
    loop: false
    frames:
      - [[crouch_legs, 6, 29], [crouch_top, 5, 11]]
      - [[roll_90, 7, 13]]
      - [[roll_135, 5, 13]]
      - [[roll_180, 8, 10]]
      - [[roll_225, 8, 6]]
      - [[roll_270, 7, 13]]
      - [[roll_315, 5, 13]]
      - [[crouch_legs, 6, 29], [crouch_top, 5, 10]]
  reload:  # one-shot, 1.6 s = reload_time: no magazine - the raygun is held up in front of the chest (the melee pose, held still) while it cools; the game puts a wisp of heat/steam particles at its tip (~x25, y0) on frames 2-13
    fps: 10
    loop: false
    frames:
      - [[idle_legs, 7, 27], [idle_top, 7, 4]]
      - [[idle_legs, 7, 27], [melee_1, 7, 0]]
      - [[idle_legs, 7, 27], [melee_2, 6, 0]]
      - [[idle_legs, 7, 27], [melee_2, 6, 0]]
      - [[idle_legs, 7, 27], [melee_2, 6, 0]]
      - [[idle_legs, 7, 27], [melee_2, 6, 0]]
      - [[idle_legs, 7, 27], [melee_2, 6, 0]]
      - [[idle_legs, 7, 27], [melee_2, 6, 0]]
      - [[idle_legs, 7, 27], [melee_2, 6, 0]]
      - [[idle_legs, 7, 27], [melee_2, 6, 0]]
      - [[idle_legs, 7, 27], [melee_2, 6, 0]]
      - [[idle_legs, 7, 27], [melee_2, 6, 0]]
      - [[idle_legs, 7, 27], [melee_2, 6, 0]]
      - [[idle_legs, 7, 27], [melee_2, 6, 0]]
      - [[idle_legs, 7, 27], [melee_1, 7, 0]]
      - [[idle_legs, 7, 27], [idle_top, 7, 4]]
  run_reload:  # the reload while running (same length as reload): reload upper body, run legs stepping every frame; same frame numbers as reload
    fps: 10
    loop: false
    frames:
      - [[run_reload_0, 0, 0]]
      - [[run_reload_1, 0, 0]]
      - [[run_reload_2, 0, 0]]
      - [[run_reload_3, 0, 0]]
      - [[run_reload_2, 0, 0]]
      - [[run_reload_3, 0, 0]]
      - [[run_reload_2, 0, 0]]
      - [[run_reload_3, 0, 0]]
      - [[run_reload_2, 0, 0]]
      - [[run_reload_3, 0, 0]]
      - [[run_reload_2, 0, 0]]
      - [[run_reload_3, 0, 0]]
      - [[run_reload_2, 0, 0]]
      - [[run_reload_3, 0, 0]]
      - [[run_reload_4, 0, 0]]
      - [[run_reload_5, 0, 0]]
