# The default Bro — the player character. Traced pixel for pixel from the reference sheet
# refrences/bros/bro rambo (each reference pose sampled on its own pixel grid, colors
# snapped to the rambo_* colors in master.yaml). Nothing is redrawn: every pose part below
# is the reference pose; animations only shift whole parts by 1 px (bob, recoil).
# Size (native, as in the reference): standing ~2 blocks (31 px), crouched ~1.6 blocks.
# Frame layers: [part, x, y] drawn in order (later layers on top). Feet on the bottom row.
name: bro
description: Default player character, traced 1:1 from the Rambo reference sheet. Red headband, black hair, green tank top, bare arms, brown pants, black boots, rifle. Faces right; the game flips it.
palette: bro
reference: "refrences/bros/bro rambo/bro.jpg"
frame: [39, 36]
muzzle_symbols: Gg  # gun tip per frame is found from these colors (GameData.MUZZLES)
anchors:
