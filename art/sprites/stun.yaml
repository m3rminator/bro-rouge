# Stun birds: three little yellow birds circling over a stunned enemy's head (Blala's gun
# bash stuns; the enemy also blinks white). Placed over the head by enemy.gd.
name: stun
description: Three little birds circling over the head of a stunned enemy - the ones passing behind the head are darker. Loops for as long as the stun lasts.
palette: fx
frame: [21, 9]
anchors:
  center: [10, 4]

parts:
  bird: |
    .YY..
    YYYYO
    .Y.Y.
  bird_back: |
    .OO..
    OOOO.
    .O.O.

animations:
  circle:
    fps: 10
    loop: true
    frames:
      - [[bird_back, 4, 1], [bird, 15, 3], [bird, 5, 5]]
      - [[bird_back, 10, 1], [bird, 13, 5], [bird, 1, 4]]
      - [[bird_back, 2, 2], [bird_back, 14, 2], [bird, 8, 6]]
      - [[bird_back, 6, 1], [bird, 3, 5], [bird, 15, 4]]
      - [[bird_back, 11, 1], [bird, 1, 3], [bird, 12, 5]]
      - [[bird_back, 3, 1], [bird_back, 15, 2], [bird, 6, 5]]
      - [[bird_back, 8, 0], [bird, 14, 4], [bird, 2, 4]]
      - [[bird_back, 13, 1], [bird_back, 1, 2], [bird, 10, 5]]
