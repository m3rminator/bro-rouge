# Explosive barrel: one block. Red drum with steel rims and a white skull.
# idle = untouched. burning = hit once: flames on the lid and the drum flashes hot
# until it blows (fuse_time in design/entities/barrel.yaml).
name: barrel
description: Red explosive barrel. Shoot it (or blast it) and it starts burning, then explodes. Barrels touching each other explode together as one bigger blast.
palette: barrel
frame: [16, 16]
anchors:
  center: [8, 9]

