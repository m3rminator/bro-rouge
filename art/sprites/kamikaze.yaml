# Suicide bomber. Built from the traced enemy soldier (refrences/enemies/default) so he has
# the same art style and size as the Bro: the rifle was removed, the sweater became an olive
# vest with a block of dynamite sticks, a red headband was added and he holds a lit stick.
# Frame layers: [part, x, y]. Feet on the bottom row. Faces right; the game flips it.
