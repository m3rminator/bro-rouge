# Palette set for the default Bro. Every color was sampled from the reference sheet
# (refrences/bros/bro rambo), so the sprite matches it 1:1. "." is always transparent.
# Recolor a character (e.g. a new Bro) by copying this file and swapping names.
symbols:
  o: rambo_black        # outline, hair, boots
  d: rambo_brown_dark   # pants outline
  R: rambo_red_dark     # headband shadow, pants shadow
  r: rambo_red          # headband
  p: rambo_brown        # pants, skin outline
  q: rambo_khaki        # gun / skin edge highlight
  S: rambo_skin_dark
  s: rambo_skin
  L: rambo_skin_light
  T: rambo_green_dark
  t: rambo_green        # tank top
  G: rambo_steel_dark   # rifle
  g: rambo_steel
  j: rambo_steel_dark   # knife blade base in the cling pose: same color, but not a gun symbol (the gun tip ignores it)
  W: rambo_swoosh_light # knife swoosh: bright edge
  v: rambo_swoosh       # knife swoosh
  V: rambo_swoosh_dark  # knife swoosh: fading
