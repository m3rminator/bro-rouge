animations:
  mag_hud:
    fps: 1
    loop: false
    frames:
      - [[mag, 2, 0]]
  mag_pickup:
    fps: 1
    loop: false
    frames:
      - [[plus, 0, 5], [mag_small, 8, 2]]
  grenade_hud:
    fps: 1
    loop: false
    frames:
      - [[grenade_icon, 1, 0]]
  grenade:
    fps: 4  # the game speeds this up as the fuse runs out
    loop: true
    frames:
      - [[grenade_ball, 4, 3]]
      - [[grenade_ball_flash, 4, 3]]
  shell_hud:  # Sharif's HUD: one shell icon next to his shell count
    fps: 1
    loop: false
    frames:
      - [[shell_icon, 4, 1]]
  shell_pickup:  # over Sharif's head after a melee kill (the game writes the number of shells next to it)
    fps: 1
    loop: false
    frames:
      - [[plus, 0, 5], [shell_small, 9, 3]]
  smg_mag_hud:  # Blala's HUD: one SMG magazine per spare magazine
    fps: 1
    loop: false
    frames:
      - [[smg_mag_icon, 4, 0]]
  smg_mag_pickup:  # over Blala's head when a melee kill gives him a magazine
    fps: 1
    loop: false
    frames:
      - [[plus, 0, 5], [smg_mag_small, 9, 2]]
  c4_hud:  # Blala's HUD: one C4 per charge left (in place of grenades)
    fps: 1
    loop: false
    frames:
      - [[c4_icon, 0, 3]]
  c4:  # a planted C4 stuck on a block or an enemy: the red display blinks until it is set off
    fps: 2
    loop: true
    frames:
      - [[c4, 2, 5]]
      - [[c4_off, 2, 5]]
  revolver_hud:  # Sharif's HUD: one revolver per round left (in place of grenades)
    fps: 1
    loop: false
    frames:
      - [[revolver_icon, 0, 2]]
  airstrike_hud:  # Hamid's HUD: the air-strike missile, nose down (in place of grenades)
    fps: 1
    loop: false
    frames:
      - [[airstrike_icon, 5, 1]]
  cell_hud:  # MIB's HUD: one raygun power cell per spare magazine (in place of mag_hud)
    fps: 1
    loop: false
    frames:
      - [[cell_icon, 4, 0]]
  cell_pickup:  # over MIB's head when a melee kill gives him a power cell
    fps: 1
    loop: false
    frames:
      - [[plus, 0, 5], [cell_small, 9, 2]]
