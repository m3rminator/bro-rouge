# Entity: destructible terrain block.
id: block
name: Terrain block
kind: terrain
order: 10
description: "24×24 solid tile that levels are built from. Bullets (player and enemy) chip it — every hit adds more cracks across its face — and at 0 HP it bursts into debris and is gone for good. Any block whose center is inside an explosion is destroyed at once. Behind every block sits a darker back wall (wall_N, not solid, drawn by scripts/back_wall.gd): when a block is shot away only that layer is gone and the dark wall shows where it was, as in Broforce. The look depends on where the block sits. In the usual earth level, blocks with open sky above (grass_clearance air tiles) become grass: one block with its own grass rim, vine loops, strands or moss, everything inside that single block (the tuft of living blades on top varies per block, see grass.yaml). The two rows of earth under the grass (and beside any open air) are calm dark earth with tiny tufts and the odd stone; the next two rows are a mix of mid earth and the layers above and below it so there is no hard line; from there down the earth is flat dark colour. Rocky blocks (rock_N) are never generated inside earth - they are kept for hand-placed stone in the level editor. A stone level (a chance per generated fight, see run.yaml) is grey rock throughout - lit tops, slabs near the air, flat dark rock deeper in. Variants, mirroring and the earth mix come from a hash of the block's map position, so tiles never repeat in a pattern and the same level always looks the same."
sprite: terrain
files:
  - game/scripts/block.gd
  - art/sprites/cracks.yaml
  - game/scripts/main.gd
level_symbols:
  "#": earth block (becomes grass automatically if it has open sky above)
  ".": empty air

stats:
  size:
    value: 24
    unit: px
    description: Side of one block — the same as the crouched Bro's hitbox height, so a crouching Bro fits through a one-block gap. Everything is measured in blocks of this size.
  hp:
    value: 3
    unit: hits
    description: Bullet hits needed to destroy one block. Each hit before the last adds cracks.
  crack_stages:
    value: 4
    unit: stages
    description: How many growing crack images a block goes through before it breaks (the last one shows one hit before the end). Each block uses one of the crack patterns, chosen from its map position.
  grass_clearance:
    value: 3
    unit: tiles
    description: A block grows grass only if this many tiles directly above it are air (or it is near the top of the map). Keeps cave and tunnel floors bare.
  debris_amount:
    value: 34
    unit: particles
    description: Dirt chunks thrown when the block breaks.
  chain_break:
    value: 0.3
    unit: chance
    description: Chance that the block directly above a breaking block breaks too, a moment later (that one can chain again).

