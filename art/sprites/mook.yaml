# Default enemy soldier ("mook"). Traced pixel for pixel from the reference sheet
# refrences/enemies/default with tools/trace_reference.py (colors: grunt_* in master.yaml).
# Same size as the Bro (about two blocks). Nothing is redrawn: every pose part below is the
# reference pose; animations only shift whole parts by 1 px (bob, recoil).
# Frame layers: [part, x, y] drawn in order. Feet on the bottom row. Faces right; the game flips it.
