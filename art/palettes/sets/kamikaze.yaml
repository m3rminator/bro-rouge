# Palette set for the suicide bomber, reworked from refrences/enemies/kamikaze: bald and
# tanned with a red headband, charcoal long sleeves, a vest of red dynamite sticks on black
# straps, khaki pants and brown boots, a lit stick in his fist.
# "." is always transparent.
symbols:
  o: grunt_black
  d: kami_pants_dark     # pants shadow
  p: kami_pants
  e: kami_skin_light
  s: kami_skin
  S: kami_skin_dark
  t: kami_sleeve         # long sleeves
  L: kami_sleeve_light
  P: kami_sleeve_dark
  B: kami_boot
  G: grunt_steel_dark
  g: grunt_steel
  r: rambo_red           # dynamite, headband
  R: rambo_red_dark
  k: grunt_black         # vest straps
  y: fire_yellow         # lit fuse
  w: fire_white
