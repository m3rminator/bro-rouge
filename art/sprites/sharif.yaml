# Sharif, the third Bro: a silver-haired sheriff - cowboy hat, silver mustache, khaki shirt, brown vest with a gold star,
# jeans, brown boots and a pump shotgun. Drawn step by step with the user on top of the Bro's poses (same size, same
# leg motion). Every frame is one whole pose (the shotgun kick moves the whole upper body, so there are no gun layers).
# Frame layers: [part, x, y] drawn in order. Feet on the bottom row.
name: sharif
description: Sharif, the third playable Bro. A silver-haired sheriff with a cowboy hat, silver mustache, khaki shirt, brown vest with a gold star, jeans and brown boots. Pump shotgun - every blast kicks his upper body back, then he racks the pump (standing, running or crouched). Melee - turns the shotgun around and rams the wooden stock forward. Grenade button - puts the shotgun away, draws a big revolver from the hip and fires one heavy shot. Faces right; the game flips it.
palette: sharif
frame: [39, 36]
muzzle_symbols: Ggi  # gun tip per frame is found from these colors (GameData.MUZZLES)
anchors:
  feet: [19, 35]

