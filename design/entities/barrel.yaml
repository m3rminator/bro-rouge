# Entity: explosive barrel.
id: barrel
name: Explosive barrel
kind: hazard
order: 11
description: Red drum with a skull, about 1.4 blocks tall (a bit shorter than the Bro), drawn from refrences/barrel. A hit from any bullet (or a nearby blast) makes it bulge and sets it burning — fire runs up both of its sides — after fuse_time it explodes. Barrels that touch each other (side by side, stacked or diagonal) explode together as ONE bigger blast — radius and damage grow with every extra barrel, and it looks different (mushroom fireball + shockwave instead of a small blast). Barrels further away that are inside the blast catch fire and go off a moment later (chain reaction). Solid — you can stand on it, and it falls if the ground under it is destroyed.
sprite: barrel
files:
  - game/scripts/barrel.gd
  - game/scripts/explosion.gd
level_symbols:
  "O": explosive barrel
level_preview:
  "O": {anim: idle}
spawns: [explosion]

stats:
  fuse_time:
    value: 0.45
    unit: s
    description: Burning time between being hit and exploding.
  chain_fuse:
    value: 0.15
    unit: s
    description: Burning time when set off by another explosion (makes chain reactions ripple).
  blast_radius:
    value: 58.0
    unit: px
    description: Blast radius of a single barrel (≈ 3.5 blocks).
  radius_per_extra:
    value: 18.0
    unit: px
    description: Extra radius for every other barrel in the same touching cluster.
  max_radius:
    value: 150.0
    unit: px
    description: Cap on the blast radius, however many barrels (about 6 blocks).
  blast_damage:
    value: 4
    unit: hp
    description: Damage a single barrel's blast deals to enemies.
  damage_per_extra:
    value: 3
    unit: hp
    description: Extra enemy damage for every other barrel in the cluster.
  blast_player_damage:
    value: 2
    unit: hearts
    description: Hearts the blast takes from the Bro (any cluster size).
  fire_particles:
    value: 8
    unit: particles
    description: Size of one flame puff on a burning barrel (each puff is randomly half to a bit more than this).
  fire_puff_interval:
    value: 0.07
    unit: s
    description: Roughly how often a new flame puff breaks out at a random spot on the burning barrel (varied by half either way).
  fire_speed:
    value: 65.0
    unit: px/s
    description: How fast the side flames shoot up.
  gravity:
    value: 800.0
    unit: px/s²
    description: Falls when the ground under it is destroyed.

animations:
  idle: Untouched.
  burning: Hit — the drum bulges and the lid pops up (second reference), flashing hot, with fire particles up both sides, about to blow.

sounds:
  barrel_ignite: It catches fire.
