# Entity: rifle bullet fired by the Bro, plus its muzzle flash.
id: bullet
name: Bro rifle bullet
kind: projectile
order: 2
description: Spawned at the Bro's "muzzle" anchor every shot. A big glowing yellow slug (about half a Bro tall) that flies straight, damages the first block, barrel or enemy it touches, sparks, then disappears.
sprite: projectiles
files:
  - game/scripts/bullet.gd
spawned_by: [bro]

stats:
  speed:
    value: 420.0
    unit: px/s
    description: Flight speed.
  lifetime:
    value: 0.8
    unit: s
    description: Disappears after this long if it hits nothing (range ≈ speed × lifetime ≈ 336 px ≈ 21 tiles).
  damage:
    value: 1
    unit: hp
    description: Damage dealt to whatever it hits.
  size:
    value: [10, 6]
    unit: px
    description: Hit box, length × height (the glow around it is bigger but harmless).

animations:
  bro_shot: The bullet in flight (halo pulses).
  impact: Spark where it hits something.
  fx/muzzle: Flash at the gun tip on every shot (plays once).
