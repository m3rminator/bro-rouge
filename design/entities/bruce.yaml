    description: A full combo that the kick finishes puts Bruce in fury for this long. The next hit on him in fury (a bullet, a blast, even a kamikaze) costs no health and ends the fury. Every kill in fury starts the time again, and when it runs out the fury ends.
  fury_share:
    value: 0.5
    unit: ratio
    description: In fury every punch and kick takes this share of an ordinary enemy's health, so two blows of anything kill.
  fury_speed:
    value: 1.5
    unit: x
    description: In fury the swings play this much faster (the fire rate, in a way).
