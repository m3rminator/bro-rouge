# Storyboard: Blala, the second Bro - who he is at a glance.
title: Blala
description: The glass cannon. Two SMGs that spray a wall of short-range bullets, a fast runner and a high jumper - nothing like the Rambo Bro.
panels:
  - title: Two SMGs
    shot: blala/idle/0
    caption: Black buzz cut, white tank top, green pants - and an SMG in each hand, one across his chest and one held out front.
  - title: Spray
    shot: blala/shoot/0
    caption: The two SMGs take turns, each flashing at its own muzzle. Twice the Bro's fire rate and a 60-round magazine, but the bullets fan out wide and die after about 5 blocks. Get close.
  - title: On the move
    shot: blala/run_shoot/0
    caption: He runs faster and jumps higher than the Bro, and keeps spraying while he runs.
  - title: Gun bash
    shot: blala/knife/0
    caption: No knife - one SMG goes up over his head...
  - title: Stunned
    shot: blala/knife/3
    caption: ...and comes down on the enemy. The first hit knocks him back stunned (blinking white, birds round his head), the second kills.
  - title: Birds
    shot: stun/circle/0
    caption: A stunned enemy cannot move or shoot until the birds are gone.
