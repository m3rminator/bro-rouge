# The Men in Black Bro's disco grenade (his grenade button): the normal grenade's shape (lever, pin, round
# segmented body) in rainbow bands that keep scrolling, so its color never stops changing. The disco light
# zone, the pull on enemies and the panic after the blast are code (dev).
name: disco_grenade
