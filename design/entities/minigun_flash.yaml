description: Heavy's muzzle flash - bigger than the rifle's, smaller than Sharif's shotgun blast - a bright burst with tracer streaks, then a smaller star. Shown at the minigun's tip on every bullet (player.gd loads it into the Bro's MuzzleFlash when his muzzle_flash stat names it).
sprite: minigun_flash
