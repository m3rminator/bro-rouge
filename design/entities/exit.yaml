# Entity: level exit (extraction truck).
id: exit
name: Extraction truck
kind: objective
order: 14
description: "The end of every level: an army truck seen from the side, parked at the right end. Locked (red beacon) until the level's kill quota is met (design/run.yaml); then the beacon blinks green and the HUD says EXIT OPEN. Run into the tailgate of the open truck and the Bro hops in under the tarp, the truck drives off and the next level loads. Running into it while locked shows how many kills are still missing."
sprite: truck
files:
  - game/scripts/level_exit.gd
level_symbols:
  "X": extraction truck (centre tile of the 5-block-long truck, standing on flat ground)
level_preview:
  "X": {anim: locked}

animations:
  locked: Kill quota not met yet (red beacon).
  open: Quota met, beacon blinks green - run into the tailgate to ride out.
  drive: Wheels spin while the truck leaves with the Bro on the bed.

sounds:
  exit_locked: You touch it while it is still locked.
  quota_reached: The last required kill - the truck opens.
  level_clear: The Bro climbs aboard.
