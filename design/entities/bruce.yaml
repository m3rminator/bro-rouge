animations:
  idle: Standing in a loose fighting stance, breathing.
  run: The run.
  jump: The jump pose.
  crouch: Crouched, one block tall.
  crouch_walk: Walking crouched.
  cling: Hanging on a wall.
  flip: The somersault off a wall.
  roll: The landing roll, and the roll off a zipline.
  jab: Left punch, the front arm straight out on frames 2 to 4.
  cross: Right punch, the body turns its back, the rear arm is out on frames 3 and 4.
  kick: A knee chamber, then the leg out on frames 3 to 5.
  combo: Jab, cross and kick back to back (not used by the game, the chain plays the three on their own).
  crouch_jab: The only attack while crouched - the front arm straightens out like the standing jab, 5 frames at 20 fps, a little lower and further back. No cross, kick or combo.
  defend: Both fists up, a two frame loop - plays while he stands shielded.
  bruce_dead/dead: His corpse.
