animations:
  idle:
    fps: 3
    loop: true
    frames:
      - [[idle_a, 4, 4]]
      - [[idle_b, 4, 5]]
  run:
    fps: 8
    loop: true
    frames:
      - [[run_a, 2, 4]]
      - [[idle_b, 4, 5]]
  shoot:
    fps: 13
    loop: true
    frames:
      - [[shoot_kick2, 2, 4]]
      - [[shoot_kick1, 3, 4]]
  pump:  # racks the pump after a shot (player.gd plays it when the shoot pose ends)
    fps: 12
    loop: false
    frames:
      - [[pump_2, 4, 4]]
      - [[pump_4, 4, 4]]
      - [[pump_4, 4, 4]]
      - [[pump_2, 4, 4]]
  run_shoot:
    fps: 13
    loop: true
    frames:
      - [[run_kick2, 1, 4]]
      - [[run_kick1, 2, 4]]
      - [[run_b_kick2, 2, 5]]
      - [[run_b_kick1, 3, 5]]
  run_pump:
    fps: 11
    loop: false
    frames:
      - [[run_pump_2, 2, 4]]
      - [[run_b_pump_4, 4, 5]]
      - [[run_pump_4, 2, 4]]
      - [[run_b_pump_2, 4, 5]]
  jump:
    fps: 1
    loop: false
    frames:
      - [[jump, 4, 2]]
  crouch:
    fps: 2
    loop: true
    frames:
      - [[crouch_a, 4, 9]]
      - [[crouch_b, 4, 10]]
  crouch_walk:
    fps: 8
    loop: true
    frames:
      - [[crouch_b, 4, 10]]
      - [[crouch_step, 4, 9]]
      - [[crouch_plant, 4, 10]]
      - [[crouch_drag, 4, 9]]
  crouch_shoot:
    fps: 13
    loop: true
    frames:
      - [[crouch_kick2, 2, 9]]
      - [[crouch_kick1, 3, 9]]
  crouch_pump:
    fps: 12
    loop: false
    frames:
      - [[crouch_pump_2, 4, 9]]
      - [[crouch_pump_4, 4, 9]]
      - [[crouch_pump_4, 4, 9]]
      - [[crouch_pump_2, 4, 9]]
  knife:  # stock bash: shotgun turned around, pulled back, wooden stock rammed forward (hit on frame 3)
    fps: 14
    loop: false
    frames:
      - [[bash_0, 0, 4]]
      - [[bash_1, 0, 4]]
      - [[bash_2, 0, 4]]
      - [[bash_3, 5, 4]]
      - [[bash_4, 5, 4]]
      - [[bash_5, 5, 4]]
  cling:
    fps: 3
    loop: true
    frames:
      - [[cling_a, 0, 1]]
      - [[cling_a, 0, 1]]
      - [[cling_b, 0, 1]]
      - [[cling_b, 0, 1]]
  flip:
    fps: 16
    loop: true
    frames:
      - [[flip_0, 5, 1]]
      - [[flip_90, 2, 4]]
      - [[flip_180, 5, 1]]
      - [[flip_270, 2, 4]]
  revolver:  # grenade button: no shotgun, draws the revolver from the hip and fires one heavy shot (shot on frame 3)
    fps: 16
    loop: false
    frames:
      - [[revolver_0, 4, 4]]
      - [[revolver_1, 4, 4]]
      - [[revolver_2, 4, 4]]
      - [[revolver_3, 3, 4]]
      - [[revolver_4, 2, 4]]
      - [[revolver_5, 3, 4]]
  crouch_revolver:  # the same while crouched (shot on frame 3)
    fps: 16
    loop: false
    frames:
      - [[crouch_revolver_0, 4, 9]]
      - [[crouch_revolver_1, 4, 9]]
      - [[crouch_revolver_2, 4, 9]]
      - [[crouch_revolver_3, 3, 9]]
      - [[crouch_revolver_4, 2, 9]]
      - [[crouch_revolver_5, 3, 9]]
  climb:  # unused by the game (same as the Bro's)
    fps: 10
    loop: false
    frames:
      - [[crouch_climb, 4, 11]]
      - [[crouch_b, 4, 10]]
      - [[crouch_a, 4, 9]]
  crouch_knife:  # the knife while crouched: the standing knife squeezed onto the crouch (hit on frame 3)
    fps: 14
    loop: false
    frames:
      - [[crouch_knife_0, 0, 9]]
      - [[crouch_knife_1, 0, 9]]
      - [[crouch_knife_2, 0, 9]]
      - [[crouch_knife_3, 4, 9]]
      - [[crouch_knife_4, 4, 9]]
      - [[crouch_knife_5, 4, 9]]
  roll:  # landing roll (fall from 2-3+ blocks while moving, not shooting): squash, compact tuck turning on the ground in 45-deg steps, rise
    fps: 24
    loop: false
    frames:
      - [[crouch_b, 4, 10]]
      - [[roll_90, 4, 15]]
      - [[roll_135, 7, 9]]
      - [[roll_180, 10, 12]]
      - [[roll_225, 6, 10]]
      - [[roll_270, 4, 15]]
      - [[roll_315, 7, 9]]
      - [[crouch_a, 4, 9]]
