animations:
  idle:
    fps: 3
    loop: true
    frames:
      - [[idle_a, 10, 5]]
      - [[idle_b, 10, 6]]
  run:
    fps: 8
    loop: true
    frames:
      - [[run_a, 8, 5]]
      - [[idle_b, 10, 6]]
  shoot:
    fps: 18
    loop: true
    frames:
      - [[shoot_0, 8, 5]]
      - [[shoot_1, 10, 6]]
      - [[shoot_2, 9, 5]]
      - [[shoot_3, 8, 6]]
  windup:  # barrels spinning up before the first bullet (player.gd), no flash
    fps: 14
    loop: true
    frames:
      - [[windup_0, 10, 5]]
      - [[windup_1, 10, 5]]
      - [[windup_2, 10, 6]]
  run_shoot:
    fps: 16
    loop: true
    frames:
      - [[run_shoot_0, 7, 5]]
      - [[run_shoot_1, 8, 5]]
      - [[run_shoot_2, 8, 6]]
      - [[run_shoot_3, 10, 6]]
  run_windup:  # the same while running
    fps: 10
    loop: true
    frames:
      - [[run_windup_0, 8, 5]]
      - [[run_windup_1, 8, 5]]
      - [[run_windup_2, 10, 6]]
      - [[run_windup_3, 10, 6]]
  jump:
    fps: 1
    loop: false
    frames:
      - [[jump, 10, 3]]
  crouch:
    fps: 2
    loop: true
    frames:
      - [[crouch_a, 10, 10]]
      - [[crouch_b, 10, 11]]
  crouch_walk:
    fps: 8
    loop: true
    frames:
      - [[crouch_b, 10, 11]]
      - [[crouch_step, 10, 10]]
      - [[crouch_plant, 10, 11]]
      - [[crouch_drag, 10, 10]]
  crouch_shoot:
    fps: 18
    loop: true
    frames:
      - [[crouch_shoot_0, 8, 10]]
      - [[crouch_shoot_1, 10, 11]]
      - [[crouch_shoot_2, 9, 10]]
      - [[crouch_shoot_3, 8, 11]]
  crouch_windup:  # the same while crouched
    fps: 14
    loop: true
    frames:
      - [[crouch_a, 10, 10]]
      - [[crouch_windup_1, 10, 10]]
      - [[crouch_windup_2, 10, 11]]
  knife:  # melee: feet planted, the minigun pulled back then shoved straight forward (hit on frame 3)
    fps: 14
    loop: false
    frames:
      - [[bash_0, 9, 5]]
      - [[bash_1, 7, 5]]
      - [[bash_2, 10, 5]]
      - [[bash_3, 10, 5]]
      - [[bash_4, 10, 5]]
      - [[bash_5, 10, 5]]
  crouch_knife:  # the same melee while crouched
    fps: 14
    loop: false
    frames:
      - [[crouch_bash_0, 9, 10]]
      - [[crouch_bash_1, 7, 10]]
      - [[crouch_bash_2, 10, 10]]
      - [[crouch_bash_3, 10, 10]]
      - [[crouch_bash_4, 10, 10]]
      - [[crouch_bash_5, 10, 10]]
  cling:  # on the wall: the front arm goes up behind the head and body, the minigun held by the back fist
    fps: 3
    loop: true
    frames:
      - [[cling_a, 6, 1]]
      - [[cling_a, 6, 1]]
      - [[cling_b, 7, 1]]
      - [[cling_b, 7, 1]]
  flip:
    fps: 16
    loop: true
    frames:
      - [[flip_0, 9, 2]]
      - [[flip_90, 9, 2]]
      - [[flip_180, 9, 2]]
      - [[flip_270, 9, 2]]
  reload:  # while reloading (player.gd): the barrel section breaks open downward like a shotgun, stays open, swings shut (12 frames at 5 fps = the 2.4 s reload_time)
    fps: 5
    loop: false
    frames:
      - [[reload_0, 10, 5]]
      - [[reload_1, 10, 5]]
      - [[reload_2, 10, 5]]
      - [[reload_3, 10, 5]]
      - [[reload_4, 10, 5]]
      - [[reload_5, 10, 5]]
      - [[reload_6, 10, 5]]
      - [[reload_7, 10, 5]]
      - [[reload_8, 10, 5]]
      - [[reload_9, 10, 5]]
      - [[reload_10, 10, 5]]
      - [[reload_11, 10, 5]]
  climb:  # unused by the game (same as the Bro's)
    fps: 10
    loop: false
    frames:
      - [[crouch_climb, 10, 12]]
      - [[crouch_b, 10, 11]]
      - [[crouch_a, 10, 10]]
  roll:  # landing roll (fall from 2-3+ blocks while moving, not shooting): squash, compact tuck turning on the ground in 45-deg steps, rise
    fps: 24
    loop: false
    frames:
      - [[crouch_b, 10, 11]]
      - [[roll_90, 10, 16]]
      - [[roll_135, 15, 13]]
      - [[roll_180, 17, 13]]
      - [[roll_225, 14, 14]]
      - [[roll_270, 10, 16]]
      - [[roll_315, 15, 13]]
      - [[crouch_a, 10, 10]]
  run_reload:  # the reload while running (same length as reload): reload upper body, run legs stepping every frame; reload frame n = run_reload frames 2n, 2n+1
    fps: 10
    loop: false
    frames:
      - [[run_reload_0, 0, 0]]
      - [[run_reload_1, 0, 0]]
      - [[run_reload_2, 0, 0]]
      - [[run_reload_3, 0, 0]]
      - [[run_reload_4, 0, 0]]
      - [[run_reload_5, 0, 0]]
      - [[run_reload_6, 0, 0]]
      - [[run_reload_7, 0, 0]]
      - [[run_reload_6, 0, 0]]
      - [[run_reload_7, 0, 0]]
      - [[run_reload_6, 0, 0]]
      - [[run_reload_7, 0, 0]]
      - [[run_reload_6, 0, 0]]
      - [[run_reload_7, 0, 0]]
      - [[run_reload_6, 0, 0]]
      - [[run_reload_7, 0, 0]]
      - [[run_reload_4, 0, 0]]
      - [[run_reload_5, 0, 0]]
      - [[run_reload_2, 0, 0]]
      - [[run_reload_3, 0, 0]]
      - [[run_reload_0, 0, 0]]
      - [[run_reload_1, 0, 0]]
      - [[run_reload_0, 0, 0]]
      - [[run_reload_1, 0, 0]]
