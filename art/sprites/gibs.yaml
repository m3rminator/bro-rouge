  ribcage:
    fps: 1
    loop: false
    frames:
      - [[ribcage, 1, 0]]
  bone:
    fps: 1
    loop: false
    frames:
      - [[bone, 3, 3]]
  bone_small:
    fps: 1
    loop: false
    frames:
      - [[bone_small, 5, 4]]
  meat_a:
    fps: 1
    loop: false
    frames:
      - [[meat_a, 6, 4]]
  meat_b:
