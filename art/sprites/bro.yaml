# The default Bro — the player character (look: refrences/bros/bro rambo). One and a half
# blocks tall when standing (24 px) and exactly one block (16 px) when crouched, so he
# fits through a single destroyed block only while crouching. The frame is 24 x 24: the
# feet are always on its bottom row, and the crouch poses use only the bottom 16 rows.
# Built from parts so the head/torso/gun stay pixel-identical across frames.
# Frame layers: [part, x, y] drawn in order (later layers on top).
# Standing rig: legs(7,15) torso(7,8) head(8,0) tail(5,2) gun(13,10) arm(11,11)
# Crouch rig:   legs(7,19) torso(7,15) head(9,8) tail(6,10) gun(13,17) arm(11,18)
name: bro
description: Default player character (Rambo style). Red headband, green tank top, rifle. Stands 1.5 blocks tall, crouches to 1 block. Faces right; the game flips it.
palette: bro
reference: "refrences/bros/bro rambo/20c5f76e-3c54-41ff-9f0e-52b5f1bb19e9.jpg"
frame: [24, 24]
anchors:
  muzzle: [23, 11]         # gun tip while standing — bullets/flash spawn here
  muzzle_crouch: [23, 18]  # gun tip while crouched
  feet: [12, 23]

