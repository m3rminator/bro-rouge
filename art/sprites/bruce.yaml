animations:
  idle:  # guard: front fist at the chin, rear fist across the belly; second frame breathes
    fps: 3
    loop: true
    frames:
      - [[idle_0, 11, 5]]
      - [[idle_1, 5, 6]]
  run:  # Bro's two-pose run with the guard kept up
    fps: 8
    loop: true
    frames:
      - [[run_0, 8, 5]]
      - [[run_1, 11, 6]]
  jump:
    fps: 1
    loop: false
    frames:
      - [[jump, 11, 5]]
  crouch:
    fps: 2
    loop: true
    frames:
      - [[crouch_0, 10, 8]]
      - [[crouch_1, 10, 9]]
  crouch_walk:
    fps: 8
    loop: true
    frames:
      - [[crouch_1, 10, 9]]
      - [[crouch_walk_1, 10, 8]]
      - [[crouch_walk_2, 10, 9]]
      - [[crouch_walk_3, 10, 8]]
  cling:  # hangs from Bro's own cling arm, knife left out
    fps: 3
    loop: true
    frames:
      - [[cling_0, 6, 1]]
      - [[cling_0, 6, 1]]
      - [[cling_1, 6, 1]]
      - [[cling_1, 6, 1]]
  flip:  # the same pixels turned a quarter turn clockwise each (lossless)
    fps: 16
    loop: true
    frames:
      - [[flip_0, 11, 5]]
      - [[flip_90, 11, 4]]
      - [[flip_180, 13, 4]]
      - [[flip_270, 12, 6]]
  roll:  # Bro's roll frames without the gun, between the two crouch frames
    fps: 24
    loop: false
    frames:
      - [[crouch_1, 10, 9]]
      - [[roll_90, 12, 15]]
      - [[roll_135, 13, 15]]
      - [[roll_180, 16, 12]]
      - [[roll_225, 16, 10]]
      - [[roll_270, 12, 15]]
      - [[roll_315, 13, 15]]
      - [[crouch_0, 10, 8]]
  jab:  # front (left) arm straight out, reach 8 then 11
    fps: 20
    loop: false
    frames:
      - [[idle_0, 11, 5]]
      - [[jab_a, 11, 5]]
      - [[jab_b, 11, 5]]
      - [[jab_b, 11, 5]]
      - [[jab_a, 11, 5]]
  cross:  # body turns its back to the camera, rear (right) arm straight out
    fps: 20
    loop: false
    frames:
      - [[cross_a, 13, 5]]
      - [[cross_b, 13, 5]]
      - [[cross_c, 13, 5]]
      - [[cross_c, 13, 5]]
      - [[cross_d, 13, 5]]
  kick:  # knee chamber, then the front leg snaps out at hip height
    fps: 20
    loop: false
    frames:
      - [[kick_chamber, 10, 5]]
      - [[kick_chamber, 10, 5]]
      - [[kick_out, 9, 5]]
      - [[kick_out, 9, 5]]
      - [[kick_out, 9, 5]]
      - [[kick_chamber, 10, 5]]
      - [[idle_0, 11, 5]]
  combo:  # jab -> cross -> kick back to back, about 0.9 s
    fps: 20
    loop: false
    frames:
      - [[idle_0, 11, 5]]
      - [[jab_a, 11, 5]]
      - [[jab_b, 11, 5]]
      - [[jab_b, 11, 5]]
      - [[jab_a, 11, 5]]
      - [[cross_a, 13, 5]]
      - [[cross_b, 13, 5]]
      - [[cross_c, 13, 5]]
      - [[cross_c, 13, 5]]
      - [[cross_d, 13, 5]]
      - [[kick_chamber, 10, 5]]
      - [[kick_chamber, 10, 5]]
      - [[kick_out, 9, 5]]
      - [[kick_out, 9, 5]]
      - [[kick_out, 9, 5]]
      - [[kick_chamber, 10, 5]]
      - [[idle_0, 11, 5]]
  crouch_jab:  # the only attack while crouched: the front arm straightens out, timed like the jab
    fps: 20
    loop: false
    frames:
      - [[crouch_0, 10, 8]]
      - [[crouch_jab_a, 10, 8]]
      - [[crouch_jab_b, 10, 8]]
      - [[crouch_jab_b, 10, 8]]
      - [[crouch_jab_a, 10, 8]]
  defend:  # the special (replaces the grenade): both fists up, 3 s invulnerable in the game
    fps: 4
    loop: true
    frames:
      - [[defend_0, 12, 5]]
      - [[defend_1, 12, 5]]
