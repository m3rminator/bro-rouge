animations:
  idle:
    fps: 3
    loop: true
    frames:
      - [[legs_stand, 7, 15], [torso, 7, 8], [head, 8, 0], [tail_a, 5, 2], [gun, 13, 10], [arm, 11, 11]]
      - [[legs_stand, 7, 15], [torso, 7, 8], [head, 8, 1], [tail_b, 5, 3], [gun, 13, 10], [arm, 11, 11]]
  run:
    fps: 10
    loop: true
    frames:
      - [[legs_run1, 7, 15], [torso, 7, 9], [head, 8, 2], [tail_a, 5, 4], [gun, 13, 11], [arm, 11, 12]]
      - [[legs_run2, 7, 15], [torso, 7, 8], [head, 8, 1], [tail_b, 5, 3], [gun, 13, 10], [arm, 11, 11]]
      - [[legs_run3, 7, 15], [torso, 7, 9], [head, 8, 2], [tail_a, 5, 4], [gun, 13, 11], [arm, 11, 12]]
      - [[legs_run2, 7, 15], [torso, 7, 8], [head, 8, 1], [tail_b, 5, 3], [gun, 13, 10], [arm, 11, 11]]
  jump:
