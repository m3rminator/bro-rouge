# Entity: bullet fired by mooks.
id: enemy_bullet
name: Enemy rifle bullet
kind: projectile
order: 4
description: Yellow slug with a red-orange halo, fired straight ahead by mooks. Slower than the Bro's, so it can be jumped over. Hurts the Bro and chips blocks and barrels; passes through other enemies.
sprite: projectiles
files:
  - game/scripts/bullet.gd
spawned_by: [mook]

stats:
  speed:
    value: 200.0
    unit: px/s
    description: Flight speed (about half the Bro's bullet).
  lifetime:
    value: 1.2
    unit: s
    description: Disappears after this long (range ≈ 240 px ≈ 15 blocks).
  damage:
    value: 1
    unit: hp
    description: Hearts taken from the Bro per hit.
  size:
    value: [9, 5]
    unit: px
    description: Hit box, length × height.

animations:
  enemy_shot: The bullet in flight (halo pulses).
  impact: Spark where it hits something.
