# Destructible terrain, 24x24, no outline so tiles join seamlessly.
# Many random variants per kind (generated once by a seeded helper, now hand-owned ASCII - edit freely).
# Which kind a block uses depends on how close it is to open air (scripts/main.gd, tools/build.py):
#   grass_N / drip_N  surface of the earth biome (strands hang into the tile below)
#   rock_N            rocky ground next to open air: slabs and rubble packed with earth
#   pebble_N          shallow earth with a few stones embedded
#   earth_N           earth a few tiles in: some clods
#   subsoil_N         low-detail earth: almost flat dark colour (second earth layer and deeper)
#   flint_N           deep earth with a stone in it
#   stonetop_N, stone_N, deep_N  the stone biome: lit top, outer slabs, dark deep rock
name: terrain
description: Earth, rock and stone variants, grass-topped variants and hanging grass strands.
palette: terrain
frame: [24, 24]

