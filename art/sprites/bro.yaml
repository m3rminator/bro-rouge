# The default Bro — the player character. Exactly one block (16 px) tall, so he
# fits through a single destroyed block. The frame is wider (24) only for the gun.
# Built from parts so the head/torso/gun stay pixel-identical across frames.
# Frame layers: [part, x, y] drawn in order (later layers on top).
# Base rig: tail(5,0) legs(7,9) torso(8,4) head(8,0) gun(13,5) arm(11,6)
name: bro
description: Default player character. Bandana, tank top, rifle. Faces right; the game flips it.
palette: bro
frame: [24, 16]
anchors:
  muzzle: [23, 6]   # gun tip in frame pixels — bullets/flash spawn here
  feet: [12, 15]

parts:
  head: |
    .ooooo.
    obbbbbo
    oBssoso
    ohsssso
    .ohhho.
  tail_a: |
    .oo.
    oBbb
    .oo.
  tail_b: |
    oobb
    oBo.
    oo..
  torso: |
    .oooooo.
    osttttso
    osttttTo
    oTttttTo
    okkkkkko
  gun: |
    ..ooooooo..
    ooggggllllo
    oGGGgoooooo
    .ooGGo.....
    ...oo......
  arm: |
    ooo...
    osSsso
    .ooooo
  legs_stand: |
    .oppppppo.
    .opPooPpo.
    .opPooPpo.
    .oPPooPPo.
    .okkookko.
    .okkkokkko
    .ooooooooo
  legs_run1: |
    .oppppppo.
    opPppppPpo
    oPPo..oPpo
    okko...oPo
    .oo....oPo
    ......okko
    ......oooo
  legs_run2: |
    .oppppppo.
    ..oPpPpo..
    ..oPpokko.
    ..oPpoooo.
    ..oPpo....
    ..okkko...
    ..ooooo...
  legs_run3: |
    .oppppppo.
    opPppppPpo
    oPPo..oPpo
    oPo....oPo
    okko...oPo
    okkko.okko
    ooooo.oooo
  legs_jump: |
    .oppppppo.
    opPppppPpo
    oPpo.oPpko
    okko.okkko
    oooo.oooo.

animations:
  idle:
    fps: 3
    loop: true
    frames:
      - [[legs_stand, 7, 9], [torso, 8, 4], [head, 8, 0], [tail_a, 5, 0], [gun, 13, 5], [arm, 11, 6]]
      - [[legs_stand, 7, 9], [torso, 8, 4], [head, 8, 1], [tail_b, 5, 2], [gun, 13, 5], [arm, 11, 6]]
  run:
    fps: 10
    loop: true
    frames:
      - [[legs_run1, 7, 9], [torso, 8, 5], [head, 8, 1], [tail_a, 5, 1], [gun, 13, 6], [arm, 11, 7]]
      - [[legs_run2, 7, 9], [torso, 8, 4], [head, 8, 0], [tail_b, 5, 1], [gun, 13, 5], [arm, 11, 6]]
      - [[legs_run3, 7, 9], [torso, 8, 5], [head, 8, 1], [tail_a, 5, 1], [gun, 13, 6], [arm, 11, 7]]
      - [[legs_run2, 7, 9], [torso, 8, 4], [head, 8, 0], [tail_b, 5, 1], [gun, 13, 5], [arm, 11, 6]]
  jump:
    fps: 1
    loop: false
    frames:
      - [[legs_jump, 7, 9], [torso, 8, 4], [head, 8, 0], [tail_b, 5, 0], [gun, 13, 5], [arm, 11, 6]]
  shoot:
    fps: 16
    loop: true
    frames:
      - [[legs_stand, 7, 9], [torso, 8, 4], [head, 8, 0], [tail_a, 5, 0], [gun, 12, 5], [arm, 10, 6]]
      - [[legs_stand, 7, 9], [torso, 8, 4], [head, 8, 0], [tail_a, 5, 0], [gun, 13, 5], [arm, 11, 6]]
  hurt:
    fps: 1
    loop: false
    frames:
      - [[legs_jump, 7, 9], [torso, 7, 4], [head, 6, 1], [tail_b, 3, 1], [gun, 11, 3], [arm, 9, 5]]
