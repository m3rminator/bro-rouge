# Raygun muzzle flash for the Men in Black Bro: a cyan energy burst instead of fire. Same layout as
# shotgun_flash: the gun tip sits 3px left of the frame center (MuzzleFlash.fire adds 3px), so the burst
# starts right at the emitter and shoots forward; flip_h mirrors it for shots to the left.
name: raygun_flash
description: The raygun shot - a white-hot cyan disc with a forward spike, then an expanding hollow energy ring, then fading sparks.
palette: rayfx
frame: [24, 15]
anchors:
  center: [12, 7]

