# Crack overlays for terrain blocks: 8 different patterns (fork, web, zig-zag, corner, tree, cross, side, chip), each in 4 stages that
# only ever add cracks (stage 4 = one hit from breaking). Generated once with a seeded script; this file is now hand-owned.
# A block picks its pattern from its map position and shows the stage matching the damage it has taken.
