# Minigun muzzle flash for Heavy: bigger than the rifle's (fx muzzle), smaller than Sharif's shotgun blast. Used by
# MuzzleFlash when a Bro has the muzzle_flash stat. The gun tip sits 3px left of the frame center (MuzzleFlash.fire adds
# 3px), so the fire starts 1px past the barrel; flip_h mirrors it for shots to the left.
name: minigun_flash
description: Heavy's minigun flash - a bright burst with tracer streaks, then a smaller star; replayed on every bullet.
palette: fx
frame: [24, 13]
anchors:
  center: [12, 6]

parts:
  flash_big: |
    ........................
    .............YO.........
    ............OOOOO.......
    ...........OOYYYOOO.....
    ..........OYYYYYYYO.....
    ..........YWWWWWWWY.....
    ..........WWWWWWWWWWYYO.
    ..........YWWWWWWWY.....
    ..........OYYYYYYYO.....
    ...........OOYYYOOO.....
    ............OOOOO.......
    .............YO.........
    ........................
  flash_small: |
    ........................
    ........................
    ........................
    ...........OOOO.........
    ..........OYYYYOYO......
    ..........YWWWWY........
    ..........WWWWWWW.......
    ..........YWWWWY........
    ..........OYYYYOYO......
    ...........OOOO.........
    ........................
    ........................
    ........................

animations:
  muzzle:
    fps: 25
    loop: false
    frames:
      - [[flash_big, 0, 0]]
      - [[flash_small, 0, 0]]
