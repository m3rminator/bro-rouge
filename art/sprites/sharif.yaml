animations:
  idle:
    fps: 3
    loop: true
    frames:
      - [[idle_a, 4, 4]]
      - [[idle_b, 4, 5]]
  run:
    fps: 8
    loop: true
    frames:
      - [[run_a, 2, 4]]
      - [[idle_b, 4, 5]]
  shoot:
    fps: 13
    loop: true
    frames:
      - [[shoot_kick2, 2, 4]]
      - [[shoot_kick1, 3, 4]]
  pump:  # racks the pump after a shot (player.gd plays it when the shoot pose ends)
    fps: 12
    loop: false
    frames:
      - [[pump_2, 4, 4]]
      - [[pump_4, 4, 4]]
      - [[pump_4, 4, 4]]
      - [[pump_2, 4, 4]]
  run_shoot:
    fps: 13
    loop: true
    frames:
      - [[run_kick2, 1, 4]]
      - [[run_kick1, 2, 4]]
      - [[run_b_kick2, 2, 5]]
      - [[run_b_kick1, 3, 5]]
  run_pump:
    fps: 11
    loop: false
    frames:
      - [[run_pump_2, 2, 4]]
      - [[run_b_pump_4, 4, 5]]
      - [[run_pump_4, 2, 4]]
      - [[run_b_pump_2, 4, 5]]
  jump:
    fps: 1
    loop: false
    frames:
      - [[jump, 4, 2]]
  hurt:  # placeholder (the jump pose) until the death pose is redrawn for all three Bros
    fps: 1
    loop: false
    frames:
      - [[jump, 4, 2]]
  crouch:
    fps: 2
    loop: true
    frames:
      - [[crouch_a, 4, 9]]
      - [[crouch_b, 4, 10]]
  crouch_walk:
    fps: 8
    loop: true
    frames:
      - [[crouch_b, 4, 10]]
      - [[crouch_step, 4, 9]]
      - [[crouch_plant, 4, 10]]
      - [[crouch_drag, 4, 9]]
  crouch_shoot:
    fps: 13
    loop: true
    frames:
      - [[crouch_kick2, 2, 9]]
      - [[crouch_kick1, 3, 9]]
  crouch_pump:
    fps: 12
    loop: false
    frames:
      - [[crouch_pump_2, 4, 9]]
      - [[crouch_pump_4, 4, 9]]
      - [[crouch_pump_4, 4, 9]]
      - [[crouch_pump_2, 4, 9]]
  knife:  # stock bash: shotgun turned around, pulled back, wooden stock rammed forward (hit on frame 3)
    fps: 14
    loop: false
    frames:
      - [[bash_0, 0, 4]]
      - [[bash_1, 0, 4]]
      - [[bash_2, 0, 4]]
      - [[bash_3, 5, 4]]
      - [[bash_4, 5, 4]]
      - [[bash_5, 5, 4]]
  cling:
    fps: 3
    loop: true
    frames:
      - [[cling_a, 0, 1]]
      - [[cling_a, 0, 1]]
      - [[cling_b, 0, 1]]
      - [[cling_b, 0, 1]]
  flip:
    fps: 16
    loop: true
    frames:
      - [[flip_0, 5, 1]]
      - [[flip_90, 2, 4]]
      - [[flip_180, 5, 1]]
      - [[flip_270, 2, 4]]
  climb:  # unused by the game (same as the Bro's)
    fps: 10
    loop: false
    frames:
      - [[crouch_climb, 4, 11]]
      - [[crouch_b, 4, 10]]
      - [[crouch_a, 4, 9]]
  crouch_knife:  # the knife while crouched: the standing knife squeezed onto the crouch (hit on frame 3)
    fps: 14
    loop: false
    frames:
      - [[crouch_knife_0, 0, 9]]
      - [[crouch_knife_1, 0, 9]]
      - [[crouch_knife_2, 0, 9]]
      - [[crouch_knife_3, 4, 9]]
      - [[crouch_knife_4, 4, 9]]
      - [[crouch_knife_5, 4, 9]]
