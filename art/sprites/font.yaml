# HUD pixel font. Each glyph is 3x5 inside a 4x6 cell (1 px spacing). The game draws it
# with a dark outline and tints it (white, yellow, red). Punctuation glyphs use names: slash, bang,
# colon, dash, dot, plus, gt, lt.
name: font
description: "3x5 pixel font for the HUD (A-Z, 0-9, / ! : - . + > <). One animation per glyph: g_<char>."
palette: font
frame: [4, 6]

parts:
  g_A: |
    .w.
    w.w
    www
    w.w
    w.w
  g_B: |
    ww.
    w.w
    ww.
    w.w
    ww.
  g_C: |
    .ww
    w..
    w..
    w..
    .ww
