animations:
  mag_hud:
    fps: 1
    loop: false
    frames:
      - [[mag, 2, 0]]
  mag_pickup:
    fps: 1
    loop: false
    frames:
      - [[plus, 0, 5], [mag_small, 8, 2]]
  grenade_hud:
    fps: 1
    loop: false
    frames:
      - [[grenade_icon, 1, 0]]
  grenade:
    fps: 4  # the game speeds this up as the fuse runs out
    loop: true
    frames:
      - [[grenade_ball, 4, 3]]
      - [[grenade_ball_flash, 4, 3]]
