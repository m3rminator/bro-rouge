# Entity: how a stunned enemy looks.
id: stun
name: Stunned enemy
kind: effect
order: 30
description: An enemy that survives a melee hit that needs more than one (Blala's gun bash, knife_hits 2) is thrown back and stands stunned for knife_stun seconds - no walking, no shooting. While stunned his whole sprite blinks white and three little white birds circle over his head (the ones passing behind the head are grey). Both stop the moment the stun ends or he dies. Bosses are never stunned.
sprite: stun
files:
  - game/scripts/enemy.gd
spawned_by: [blala]

stats:
  blink_interval:
    value: 0.08
    unit: s
    description: The stunned sprite switches between bright white and normal this often.
  birds_above_head:
    value: 5.0
    unit: px
    description: How far above the top of the enemy's hitbox the birds circle (center of the circle).

animations:
  stun/circle: The birds go once around the head in 0.8 s, looping for as long as the stun lasts.
