# Every input action in the game — the single source of truth.
# tools/build.py turns this into game/scripts/generated/game_data.gd (used by
# game/scripts/controls.gd) and the "Controls" section of docs/catalog.html.
# Key names: letters (A-Z), digits (0-9), Left/Right/Up/Down, Space, Enter,
# Escape, Tab, Shift, Ctrl, Alt.
actions:
  move_left:
    label: Move left
    keys: [A, Left]
    description: Run left. The Bro turns to face left, so he also shoots left.
  move_right:
    label: Move right
    keys: [D, Right]
    description: Run right. The Bro turns to face right, so he also shoots right.
  jump:
    label: Jump
    keys: [W, Up, Space]
    description: Jump. Only works while standing on the ground (no double jump yet).
  shoot:
    label: Shoot
    keys: [J, X]
    description: Hold to fire continuously in the direction the Bro faces. Bullets break dirt blocks.
  crouch:
    label: Crouch
    keys: [S, Down]
    description: Hold to crouch. The Bro drops into the reference crouch pose (about 1.6 blocks instead of 2), moves slower, and can still shoot. He cannot jump while crouched, and stays crouched under a low ceiling until there is room to stand.
  knife:
    label: Knife
    keys: [K, C]
    description: Quick knife slash in front of the Bro (about one block). Kills any normal enemy in one hit and throws him back in a burst of blood; the Brute takes several. Every knife kill gives one spare magazine (up to 3). He can't shoot while slashing and only shuffles forward slowly.
  grenade:
    label: Grenade
    keys: [Q]
    description: Throw a grenade in an arc in front of the Bro (a low roll while crouched). It bounces, blinks and explodes after 2 seconds like a barrel. Three per level, refilled only when a level is finished. Throwing one while hanging on a wall blows it up in his hand.
  reload:
    label: Reload
    keys: [R]
    description: Swap to a fresh magazine now. The gun also reloads by itself when the magazine runs dry.
  interact:
    label: Interact
    keys: [E]
    description: Use a station in the safe house (restock ammo, refill hearts and lives, refill grenades) when standing next to it.
