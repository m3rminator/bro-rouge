# The run loop: which levels are played, in what order, and what clears each one.
# Generated into GameData.RUN. The build checks that every map exists, has an exit
# ("X") and enough enemies to meet its kill quota.
name: Run loop
description: A run is endless and every level is generated fresh (scripts/level_gen.gd) - fight, fight, BOSS (a Brute), then a safe-house HUB (after EVERY level) where the Bro can walk around and restock ammo, refill hearts, and refill grenades - then it starts again, every level with real height - hills with stairs, valleys, narrow gaps and towers of floating platforms, enemies on every level of it - and every loop (not every level) a little bigger, fuller and tougher (more enemies, more kamikazes, higher kill quota, more barrels). Each level has at least min_enemies enemies; the exit flag opens after the kill quota (a boss level needs every enemy dead, the Brute included). Hearts and ammo carry over from level to level, so the hub matters. Dying costs one life and restarts the current level (same layout, kills reset, hearts refilled); losing the last life ends the run and you start again from the first fight with full lives. The three hand-made maps listed under 'levels' are no longer part of the run - they stay as reference and test maps.

stats:
  lives:
    value: 2
    unit: lives
    description: Lives at the start of a run - the Bro himself and ONE extra (the HUD shows X1 next to the hearts). Each death costs one and restarts the current level; the run is over when none is left.
  clear_delay:
    value: 2.0
    unit: s
    description: How long "LEVEL CLEAR" shows before the next level loads.
  run_over_delay:
    value: 3.0
    unit: s
    description: How long "RUN OVER" shows after the last life is lost, before a new run starts.
  upgrade_mag:
    value: 0.5
    unit: ratio
    description: A random upgrade crate makes the magazine this much bigger for upgrade_time seconds (shell Bros get more shells).
  upgrade_rate:
    value: 0.3
    unit: ratio
    description: A random upgrade crate makes the gun fire this much faster for upgrade_time seconds (the time between shots shrinks).
  upgrade_speed:
    value: 0.24
    unit: ratio
    description: A random upgrade crate makes the Bro run this much faster for upgrade_time seconds.
  upgrade_damage:
    value: 1.0
    unit: ratio
    description: A random upgrade crate makes every bullet hit this much harder (1.0 = double damage) for upgrade_time seconds.
  perk_heart:
    value: 1
    unit: hearts
    description: The safe house power station perk "heart" - one more heart for the rest of the run (and it is filled at once). It stacks.
  perk_spare:
    value: 1
    unit: magazines
    description: Perk "belt" - one more spare magazine for the rest of the run. The belt's limit (max_spare_mags) goes up by one too, and one is added now.
  perk_grenade:
    value: 1
    unit: grenades
    description: Perk "grenade" - carry one more grenade (the limit goes up by one) for the rest of the run, and get that one now.
  perk_size:
    value: 0.15
    unit: ratio
    description: Perk "magazine" - every magazine holds this much more (shell Bros hold more shells), for the rest of the run. It stacks.
  perk_rate:
    value: 0.1
    unit: ratio
    description: Perk "trigger" - the gun fires this much faster for the rest of the run. It stacks.
  perk_speed:
    value: 0.06
    unit: ratio
    description: Perk "legs" - the Bro runs this much faster for the rest of the run. It stacks.
  perk_damage:
    value: 0.15
    unit: ratio
    description: Perk "rounds" - every bullet hits this much harder for the rest of the run. It stacks.
  perk_jump:
    value: 0.05
    unit: ratio
    description: Perk "spring" - every jump is this much stronger for the rest of the run. It stacks.
  perk_reload:
    value: 0.12
    unit: ratio
    description: Perk "quick hands" - a magazine swap takes this much less time for the rest of the run (never below a third). It stacks.
  enemy_hp_per_loop:
    value: 0.35
    unit: ratio
    description: Every enemy (not the Brute) has this much more health for each boss loop already cleared.
  upgrade_time:
    value: 30.0
    unit: s
    description: How long a crate upgrade lasts. Taking the same one again starts the 30 seconds over.
  run_multiplier:
    value: 2.0
    unit: x
    description: Double-tap a direction and the Bro runs - starting at run_start and building up to this multiple of his normal speed over run_ramp_time - until he lets go.
  run_bullet_speed:
    value: 2.0
    unit: x
    description: Shooting while running (any Bro but MIB, whose beam has no bullets) - the bullets fly this many times faster. They live this many times shorter, so the range stays the same.
  run_spread_min:
    value: 1.5
    unit: degrees
    description: Shooting while running - even a gun with no spread of its own wobbles at least this much (before the multiplier).
  run_spread_mult:
    value: 2.0
    unit: x
    description: Shooting while running - the gun's spread is this many times wider.
  run_start:
    value: 1.5
    unit: x
    description: The speed multiple at the first step of a run, before it builds up.
  zip_speed:
    value: 150.0
    unit: px/s
    description: How fast the Bro rides a zipline between two towers (levels with a chasm, level_gen.gd _skyline).
  run_ramp_time:
    value: 1.2
    unit: s
    description: How long a run takes to build from run_start to run_multiplier.
  double_tap_time:
    value: 0.3
    unit: s
    description: Two taps on the same direction closer together than this count as a double tap.

  background_parallax:
    value: 0.3
    unit: ratio
    description: The jungle backdrop (game/assets/backgrounds/jungle.jpg, scripts/background.gd) scrolls at this fraction of the camera's speed — 0 would glue it to the screen, 1 would pin it to the world. It is scaled to just cover the screen and mirrored end to end, so it never runs out.

  bg_forest_parallax:
    value: 0.5
    unit: ratio
    description: Background layer 1 (art bg_forest, the nearest, two rows of trees) scrolls sideways at this fraction of the camera's speed (scripts/background.gd). It is the one that reacts most.
  bg_hills_parallax:
    value: 0.25
    unit: ratio
    description: Background layer 2 (art bg_hills, hazy hills) horizontal scroll fraction.
  bg_jungle_parallax:
    value: 0.375
    unit: ratio
    description: Background layer behind the forest and in front of the hills (art bg_jungle) horizontal scroll fraction.
  bg_cloud_parallax:
    value: 0.12
    unit: ratio
    description: The drifting clouds, between the sky and the hills, horizontal scroll fraction.
  bg_sky_parallax:
    value: 0.05
    unit: ratio
    description: Background layer 3 (art bg_sky, the blue gradient strip) horizontal scroll fraction - it barely moves.
  bg_forest_sink:
    value: 0.6
    unit: ratio
    description: For every pixel the camera climbs above the lowest point of the level, the forest layer (the nearest) sinks this many pixels down the screen (so more sky shows). Faster than the layers behind it.
  bg_hills_sink:
    value: 0.3
    unit: ratio
    description: Same for the hills layer.
  bg_jungle_sink:
    value: 0.45
    unit: ratio
    description: Same for the jungle layer (behind the forest, in front of the hills).
  bg_cloud_sink:
    value: 0.15
    unit: ratio
    description: Same for the clouds.
  bg_hills_lift:
    value: 150.0
    unit: px
    description: At ground level the bottom of the hills layer sits this many pixels above the bottom of the screen (behind the jungle, so the hills peek out above its trees).
  bg_jungle_lift:
    value: 110.0
    unit: px
    description: At ground level the bottom of the jungle layer sits this many pixels above the bottom of the screen - about on the ground line (the terrain fills the lower ~45% of the screen), its trees rising well above it.
  bg_fog_count:
    value: 7
    unit: banks
    description: Banks of mist drifting in the jungle's damp air, for each of the three depth layers (behind the hills, between the jungle and the forest, in front of the forest). Each is a wide, low, soft-edged haze of pale blue-grey lying on the ground (never up in the sky).
  bg_fog_alpha:
    value: 0.55
    unit: ratio
    description: How solid the mist is at its thickest. The far layer is a third of this and the near one the full value, so the distance fades away.
  bg_fog_drift:
    value: 5.0
    unit: px/s
    description: Top speed a mist bank drifts sideways (each picks its own, slower, and its own way). It also slides with the layer it belongs to as the camera moves.
  bg_cloud_count:
    value: 4
    unit: clouds
    description: Big clouds (24-110 px wide) alive at once. The user finds many big white shapes distracting, so keep it 3-5.
  bg_wisp_count:
    value: 3
    unit: wisps
    description: Tiny cloud wisps (6-14 px wide) alive at once.
  bg_cloud_drift:
    value: 6.0
    unit: px/s
    description: Fastest sideways drift of a cloud; each cloud picks its own speed between 20% and 100% of this, in a random direction.
  bg_cloud_top:
    value: 8.0
    unit: px
    description: Highest screen row a cloud floats at (at ground level).
  bg_cloud_bottom:
    value: 120.0
    unit: px
    description: Lowest screen row (cloud bottom edge) a cloud floats at.

  boss_every:
    value: 4
    unit: levels
    description: Every this many fights (three fights, then the boss) the last one is a boss level (a Brute), and a hub follows it.
  stone_biome_chance:
    value: 0.35
    unit: chance
    description: Chance that a generated fight level is a stone level - grey rock all the way through, no grass - instead of the usual jungle earth (rocky near open air, earthy deeper in, a few stones scattered through it). The safe house is always earth.
  min_enemies:
    value: 40
    unit: enemies
    description: Enemies in the very first level (a boss level gets this many soldiers plus the Brute).
  enemies_per_depth:
    value: 7.5
    unit: enemies
    description: Extra enemies for every fight of the loops already completed (a loop = boss_every fights; difficulty steps up once per loop, not per level) (plus a random 0-3).
  max_enemies:
    value: 160
    unit: enemies
    description: Cap on enemies per level.
  width_base:
    value: 150
    unit: tiles
    description: Width of the first level (a block is 24 px).
  width_per_depth:
    value: 12.5
    unit: tiles
    description: Extra width for every fight of the loops already completed (steps up once per loop).
  width_max:
    value: 350
    unit: tiles
    description: Cap on level width.
  boss_width:
    value: 72
    unit: tiles
    description: Width of the first boss level - just a short run-up and the arena (it also grows with width_per_depth per boss cleared). There are no other enemies - the Bro steps off the truck into the Brute's arena and the Brute goes for him at once.
  platform_towers_base:
    value: 5
    unit: towers
    description: Towers of floating platforms (2-4 tiers, each two blocks higher than the last, one jump apart) in the first level. Enemies and barrels also stand on them.
  platform_towers_per_depth:
    value: 1.0
    unit: towers
    description: Extra towers for every fight of the loops already completed (steps up once per loop).
  platform_towers_max:
    value: 17
    unit: towers
    description: Cap on towers per level.
  kamikaze_base:
    value: 0.12
    unit: share
    description: Share of the soldiers that are kamikazes in the first level.
  kamikaze_per_depth:
    value: 0.02
    unit: share
    description: Extra kamikaze share for every fight of the loops already completed (steps up once per loop).
  kamikaze_max:
    value: 0.4
    unit: share
    description: Cap on the kamikaze share.
  vest_base:
    value: 0.08
    unit: share
    description: Share of the soldiers that are vest soldiers (3 hits, headshot kills) in the first level.
  vest_per_depth:
    value: 0.03
    unit: share
    description: Extra vest share per loop completed.
  vest_max:
    value: 0.3
    unit: share
    description: Cap on the vest share.
  helmet_base:
    value: 0.12
    unit: share
    description: Share of the soldiers that are helmet soldiers in the first loop.
  helmet_per_depth:
    value: 0.03
    unit: share
    description: Extra helmet share per loop completed.
  helmet_max:
    value: 0.2
    unit: share
    description: Cap on the helmet share.
  barrel_clusters_base:
    value: 5
    unit: clusters
    description: Explosive barrel clusters (1-3 barrels each) in the first level (a boss arena always has 5 near the Brute).
  barrel_clusters_per_depth:
    value: 0.6
    unit: clusters
    description: Extra barrel clusters for every fight of the loops already completed (steps up once per loop).
  quota_base:
    value: 0.7
    unit: share
    description: Share of the enemies that must be killed to open the exit, in the first level.
  quota_per_depth:
    value: 0.02
    unit: share
    description: Extra share required for every fight of the loops already completed (steps up once per loop).
  quota_max:
    value: 0.9
    unit: share
    description: Cap on the kill-quota share.

levels:
  - map: level_01
    title: Jungle Outpost
    kill_quota: 8
    note: The test level. Single barrels, 3- and 5-barrel clusters, two kamikazes, mooks everywhere.
  - map: level_02
    title: The Tunnels
    kill_quota: 10
    note: Underground. Kamikaze packs in tight spaces, barrel stacks, a sunken chamber.
  - map: level_03
    title: Brute Arena
    kill_quota: 7
    note: Mini-boss level. The Brute guards an open arena; use the barrels against him.
