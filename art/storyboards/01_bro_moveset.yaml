# Storyboard: how the default Bro moves and fights. "shot" = sprite/animation/frame.
title: Bro — moveset
description: The beats every Bro must sell. New Bros copy this board and change only what is unique to them.
panels:
  - title: Ready
    shot: bro/idle/0
    caption: Stands his ground, rifle up, bandana fluttering. Always looks ready to fight.
  - title: Run
    shot: bro/run/0
    caption: Fast, forward-leaning sprint. Body bobs on each step, gun never lowers.
    sfx: footstep
  - title: Jump
    shot: bro/jump/0
    caption: Tucked legs, bandana flips up. Jump is high and snappy, not floaty.
    sfx: jump
  - title: Shoot
    shot: bro/shoot/0
    caption: Gun kicks back 1px each shot, muzzle flash at the tip. Hold to spray.
    sfx: shoot
  - title: Crouch
    shot: bro/crouch/0
    caption: Hold Crouch (S / Down) and the Bro drops from one and a half blocks to exactly one. He moves slower but can still shoot, and he fits through a one-block tunnel. Under a low ceiling he stays down until there is room to stand.
  - title: Destroy
    shot: terrain/grass_1/0
    caption: Bullets chew through dirt. Three hits and a block bursts into debris. Standing he is 1.5 blocks tall, so a single destroyed block is a tunnel only a crouching Bro fits through.
    sfx: block_break
  - title: Spotted
    shot: mook/idle/0
    caption: A mook only sees forward. Step in front of him, near his height, with nothing in between, and a "!" pops up — you have half a second.
    sfx: enemy_alert
  - title: Firefight
    shot: mook/shoot/0
    caption: He fires slow red bursts. Jump over them, or break the block under him. Two hits and he drops.
    sfx: enemy_shoot
  - title: Hit
    shot: bro/hurt/0
    caption: Each enemy hit costs a heart and makes the Bro blink (briefly invulnerable). Lose all three and you lose a life; the level restarts. Blasts take two or three hearts at once and throw you.
    sfx: player_hurt
