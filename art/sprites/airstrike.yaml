    .ohgo.
    .ohgo.
    .ohgo.
    .ohgo.
    .ohgo.
    .orRo.
    .orRo.
    .orRo.
    ..oo..
  flame_a: |
    ...O..
    ..YO..
    ..WY..
    .OWWO.
  flame_b: |
    ......
    ..O...
    ..YO..
    .OYYO.

animations:
  missile:
    fps: 12
    loop: true
    frames:
      - [[flame_a, 0, 0], [body, 0, 4]]
      - [[flame_b, 0, 0], [body, 0, 4]]
