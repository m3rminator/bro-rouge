animations:
  idle:
    fps: 3
    loop: true
    frames:
      - [[idle_legs, 5, 27], [idle_top, 5, 5]]
      - [[idle_legs, 5, 27], [idle_top, 5, 6]]
  run:
    fps: 8
    loop: true
    frames:
      - [[run, 2, 5]]
      - [[idle_legs, 5, 27], [idle_top, 5, 6]]
  sprint:  # double-tap run: the run cycle leaning forward (test on Bro first)
    fps: 8
    loop: true
    frames:
      - [[sprint_0, 2, 5]]
      - [[sprint_1, 7, 6]]
  jump:
    fps: 1
    loop: false
    frames:
      - [[jump, 4, 4]]
  shoot:
    fps: 18
    loop: true
    frames:
      - [[shoot_body, 3, 5], [shoot_gun, 3, 5], [shoot_hand, 3, 5]]
      - [[shoot_body, 3, 5], [shoot_gun, 4, 5], [shoot_hand, 3, 5]]
  crouch:
    fps: 2
    loop: true
    frames:
      - [[crouch_legs, 3, 29], [crouch_top, 3, 10]]
      - [[crouch_legs, 3, 29], [crouch_top, 3, 11]]
  crouch_walk:
    fps: 8
    loop: true
    frames:
      - [[crouch_legs, 3, 29], [crouch_top, 3, 11]]
      - [[crouch_legs_step, 3, 29], [crouch_top, 3, 10]]
      - [[crouch_legs_plant, 3, 29], [crouch_top, 3, 11]]
      - [[crouch_legs_drag, 3, 29], [crouch_top, 3, 10]]
  crouch_shoot:
    fps: 18
    loop: true
    frames:
      - [[crouch_body, 3, 10], [crouch_gun, 3, 10], [crouch_hand, 3, 10]]
      - [[crouch_body, 3, 10], [crouch_gun, 4, 10], [crouch_hand, 3, 10]]
  knife:
    fps: 14
    loop: false
    frames:
      - [[knife_ready, 4, 5]]
      - [[knife_ready, 4, 5]]
      - [[knife_ready, 4, 5]]
      - [[knife_slash, 5, 1], [swoosh_a, 28, 7], [knife_blade, 30, 5]]
      - [[knife_slash, 5, 1], [swoosh_b, 32, 7], [knife_blade, 30, 5]]
      - [[knife_slash, 5, 1], [swoosh_c, 33, 7], [knife_blade, 30, 5]]
  run_shoot:
    fps: 16  # same stride as run (8 fps per pose), the rifle shakes twice per pose
    loop: true
    frames:
      - [[run_body, 2, 5], [run_gun, 2, 5], [run_hand, 2, 5]]
      - [[run_body, 2, 5], [run_gun, 3, 5], [run_hand, 2, 5]]
      - [[run_b_body, 5, 5], [run_b_gun, 5, 5], [run_b_hand, 5, 5]]
      - [[run_b_body, 5, 5], [run_b_gun, 6, 5], [run_b_hand, 5, 5]]
  cling:
    fps: 3  # a slow sway, a pixel toward the wall and back
    loop: true
    frames:
      - [[cling_head, 0, 0], [cling_body, 0, 17], [cling_legs, 0, 27]]
      - [[cling_head, 0, 0], [cling_body, 0, 17], [cling_legs, 0, 27]]
      - [[cling_head_b, 0, 0], [cling_body, 1, 17], [cling_legs, 1, 27]]
      - [[cling_head_b, 0, 0], [cling_body, 1, 17], [cling_legs, 1, 27]]
  flip:
    fps: 16  # one full forward somersault every 0.25 s (the game turns it the right way when facing left)
    loop: true
    frames:
      - [[flip_0, 4, 4]]
      - [[flip_90, 5, 3]]
      - [[flip_180, 4, 4]]
      - [[flip_270, 5, 3]]
  climb:
    fps: 10  # not used yet: squashed crouch, rising, standing (a landing after a flip)
    loop: false
    frames:
      - [[crouch_legs, 3, 29], [crouch_top, 3, 12]]
      - [[crouch_legs, 3, 29], [crouch_top, 3, 11]]
      - [[crouch_legs, 3, 29], [crouch_top, 3, 10]]
  crouch_knife:  # the knife while crouched: the standing knife squeezed onto the crouch (hit on frame 3)
    fps: 14
    loop: false
    frames:
      - [[crouch_knife_0, 4, 10]]
      - [[crouch_knife_1, 4, 10]]
      - [[crouch_knife_2, 4, 10]]
      - [[crouch_knife_3, 4, 6]]
      - [[crouch_knife_4, 4, 6]]
      - [[crouch_knife_5, 4, 6]]
  roll:  # landing roll (fall from 2-3+ blocks while moving, not shooting): squash, compact tuck turning on the ground in 45-deg steps, rise
    fps: 24
    loop: false
    frames:
      - [[crouch_legs, 3, 29], [crouch_top, 3, 11]]
      - [[roll_90, 6, 15]]
      - [[roll_135, 7, 15]]
      - [[roll_180, 10, 12]]
      - [[roll_225, 10, 10]]
      - [[roll_270, 6, 15]]
      - [[roll_315, 7, 15]]
      - [[crouch_legs, 3, 29], [crouch_top, 3, 10]]
  reload:  # one-shot, 1.4 s = reload_time: only the far hand moves; the dropped magazine is a particle the game spawns on frame 3
    fps: 5
    loop: false
    frames:
      - [[idle_legs, 5, 27], [idle_top, 5, 5]]
      - [[reload_1, 0, 0]]
      - [[reload_2, 0, 0]]
      - [[reload_3, 0, 0]]
      - [[reload_4, 0, 0]]
      - [[reload_5, 0, 0]]
      - [[idle_legs, 5, 27], [idle_top, 5, 6]]
  run_reload:  # the reload while running (same length as reload): reload upper body, run legs stepping every frame; reload frame n = run_reload frames 2n, 2n+1
    fps: 10
    loop: false
    frames:
      - [[run_reload_0, 0, 0]]
      - [[run_reload_1, 0, 0]]
      - [[run_reload_2, 0, 0]]
      - [[run_reload_3, 0, 0]]
      - [[run_reload_4, 0, 0]]
      - [[run_reload_5, 0, 0]]
      - [[run_reload_6, 0, 0]]
      - [[run_reload_7, 0, 0]]
      - [[run_reload_4, 0, 0]]
      - [[run_reload_5, 0, 0]]
      - [[run_reload_2, 0, 0]]
      - [[run_reload_3, 0, 0]]
      - [[run_reload_8, 0, 0]]
      - [[run_reload_9, 0, 0]]
