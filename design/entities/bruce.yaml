# Entity: Bruce Parche, a playable Bro (the sixth character, id "bruce"). He has no gun: Shoot throws a jab, a cross and a kick,
# one more with every press. Only the numbers that differ from the default Bro live here; everything else comes from
# design/entities/bro.yaml. Generated into GameData.BRUCE and laid over GameData.BRO by Run.bro_stats().
id: bruce
name: Bruce Parche (playable Bro)
kind: player
order: 1.9
description: A martial artist with no gun. Shoot chains a left jab, a right cross and a kick (one per press, or hold). The three together take exactly one ordinary enemy's health, so the kick finishes a full combo - and a combo that the kick finishes puts him in fury for ten seconds (every kill starts the time again) with swings 30 percent faster and kills in two blows. Every fourth finisher gives him half a heart. A swing steps him forward and its hit-aura destroys enemy bullets that run into it. His grenade button is defend - a three second shield, two charges per level and twelve seconds between uses.
sprite: bruce
files:
  - game/scripts/character_select.gd
  - game/scripts/run.gd
  - game/scripts/player.gd
  - game/scripts/enemy.gd
  - game/scripts/punch_aura.gd
controls: [move_left, move_right, jump, crouch, shoot, grenade]

stats:
  weapon:
    value: fists
    unit: kind
    description: No gun - Shoot throws punches and kicks (jab, cross, kick, one per press, chained).
  explosive:
    value: defend
    unit: kind
    description: The grenade button is his special - defend, a shield that nothing can hurt him through.
  speed:
    value: 132.0
    unit: px/s
    description: Run speed - 10 percent faster than the default Bro (120), he has to close the distance to his enemies.
  max_spare_mags:
    value: 0
    unit: magazines
    description: He carries no magazines.
  magazines:
    value: 1
    unit: magazines
    description: No spare magazines (the one in hand is counted).
  magazine_size:
    value: 0
