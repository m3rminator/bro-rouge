animations:
  idle:  # standing still, minigun at the hip
    fps: 2
    loop: true
    frames:
      - [[top, 2, 0], [legs, 2, 34]]
  walk:  # no walk in the redesign yet - same as idle until the new boss behaviour is decided
    fps: 2
    loop: true
    frames:
      - [[top, 2, 0], [legs, 2, 34]]
  spin:  # barrels spinning up, body still
    fps: 14
    loop: true
    frames:
      - [[top, 2, 0], [legs, 2, 34]]
      - [[top_spin, 2, 0], [legs, 2, 34]]
  shoot:  # firing: barrels spin, upper body kicks back 1-2 px and down 1, legs stay planted
    fps: 16
    loop: true
    frames:
      - [[top, 1, 0], [legs, 2, 34]]
      - [[top_spin, 0, 1], [legs, 2, 34]]
      - [[top, 1, 0], [legs, 2, 34]]
      - [[top_spin, 0, 0], [legs, 2, 34]]
  kneel:  # resting on one knee between phases
    fps: 2
    loop: true
    frames:
      - [[kneel, 0, 0]]
  angry:  # angry at a phase change: idle body, angry head, upper body shaking
    fps: 12
    loop: true
    frames:
      - [[top_angry, 2, 0], [legs, 2, 34]]
      - [[top_angry, 3, 0], [legs, 2, 34]]
  hurt:  # death: slumped on his knees, full of bullet holes and blood
    fps: 1
    loop: false
    frames:
      - [[dead, 0, 0]]
