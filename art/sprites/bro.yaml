    osstttttso
    ossttttTso
    oSsttTTtso
    .okkkkkko.
  gun: |
    ..ooooooo..
    ooggggllllo
    oGGGgoooooo
    .ooGGo.....
    ...oo......
  arm: |
    ooo...
    osSsso
    .ooooo
  legs_stand: |
    .oppppppo.
    .opPooPpo.
    .opPooPpo.
    .opPooPpo.
    .oPPooPPo.
    .oPPooPPo.
    .ommoommo.
    .ommmommmo
    .ooooooooo
  legs_run1: |
    .oppppppo.
    opPppppPpo
    oPPo..oPpo
    oPo....oPo
    ommo...oPo
    .oo....oPo
    ......ommo
    .....ommmo
    .....ooooo
  legs_run2: |
    .oppppppo.
    ..oPpPpo..
    ..oPpPpo..
    ..oPpPpo..
    ..oPpPpo..
    ..oPpPpo..
    ..ommmmo..
    ..ommmmmo.
    ..ooooooo.
  legs_run3: |
