# Tunnel door: the wooden door across the underground corridors (game/scripts/tunnel_door.gd). Shut it is seen
# edge-on, a narrow plank column 8 px wide and 3 blocks high; it swings round on its hinge (the shut door's right edge)
# to face the camera, 28 px wide, like the user's reference. Built from scratchpad door/door2.py.
name: tunnel_door
