  drum: |
    .oooooooooooo.
    oGgggggggggGGo
    oGGGGGGGGGGGGo
    orRRRRRRRRRRDo
    orRRRwwwwRRRDo
    orRRwwwwwwRRDo
    orRRwoowowRRDo
    orRRwwwwwwRRDo
    orRRRwowwRRRDo
    oGgggggggggGGo
    orRRRRRRRRRRDo
    oGGGGGGGGGGGGo
    .oooooooooooo.
  drum_hot: |
    .oooooooooooo.
    oGgggggggggGGo
    oGGGGGGGGGGGGo
    oYrrrrrrrrrrRo
    oYrrrwwwwrrrRo
    oYrrwwwwwwrrRo
    oYrrwoowowrrRo
    oYrrwwwwwwrrRo
    oYrrrwowwrrrRo
    oGgggggggggGGo
    oYrrrrrrrrrrRo
    oGGGGGGGGGGGGo
    .oooooooooooo.
  flame_a: |
    ...Y......
    ..YOY..Y..
    .YOWOY.OY.
